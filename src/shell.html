<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course drill</title>
<style>
:root{
  --ink:#16202E; --ink-2:#22303F; --paper:#FFFFFF; --surface:#F2F4F7;
  --line:#D3DAE3; --line-soft:#E7ECF1;
  --text:#16202E; --text-dim:#5A6878;
  --ok:#1B7F4B; --ok-bg:#E8F5ED; --bad:#B3261E; --bad-bg:#FCEBEA;
  --warn:#B26B00; --warn-bg:#FDF3E2; --accent:#2F5FA8; --accent-bg:#EAF0F9;
  --sik:#2F5FA8; --yen:#7A3E9D;
  --r:10px; --maxw:860px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
.prose{font-family:Georgia,"Iowan Old Style","Source Serif 4",serif; line-height:1.62}
.gloss{color:var(--text-dim);font-size:.9em;font-style:italic}
.teach h5.tsec{margin:16px 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.055em;
  text-transform:uppercase;color:var(--accent,#2E5C8A)}
.teach h5.tsec:first-of-type{margin-top:10px}
.teach .prose+h5.tsec{border-top:1px solid rgba(0,0,0,.07);padding-top:14px}
.teach .prose{margin:0 0 2px}
.teach ul.tlist{margin:4px 0 2px;padding:0 0 0 18px}
.teach ul.tlist li{margin:4px 0;font-size:14.5px;line-height:1.55}
.teach ul.tlist li::marker{color:var(--accent)}
ul.tlist{margin:6px 0 4px;padding:0 0 0 18px}
ul.tlist li{margin:4px 0;line-height:1.5}
ul.tlist li::marker{color:var(--accent)}
.reftab ul.tlist{margin:2px 0;padding-left:16px}
.reftab ul.tlist li{margin:2px 0}
blockquote.prose{margin:6px 0;padding:6px 10px;border-left:3px solid var(--line);background:var(--card)}
.prose .gloss{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.86em}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- chrome ---------- */
header{
  background:var(--ink); color:#fff; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
header .who{font-size:12px;color:#9FB0C4;margin-left:auto;display:flex;gap:8px;align-items:center}
header .who button{background:#2A3A4D;color:#DCE6F2;border:1px solid #3B4F66;border-radius:6px;padding:3px 9px;font-size:12px}
nav{background:var(--ink-2);display:flex;gap:2px;padding:0 8px;overflow-x:auto;position:sticky;top:44px;z-index:39}
nav button{
  background:none;border:0;color:#9FB0C4;padding:10px 14px;font-size:14px;
  border-bottom:3px solid transparent;white-space:nowrap
}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:#6FA0E8}
main{max-width:var(--maxw);margin:0 auto;padding:18px 14px 90px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:16px;margin:22px 0 8px}
.sub{color:var(--text-dim);font-size:14px;margin:0 0 18px}
.hide{display:none !important}

/* ---------- topic list ---------- */
.topic{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden
}
.topic>summary{
  padding:13px 15px;display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none
}
.topic>summary::-webkit-details-marker{display:none}
.topic>summary::before{content:"▸";color:var(--text-dim);font-size:13px;transition:transform .15s}
.topic[open]>summary::before{transform:rotate(90deg)}
.topic .tname{font-weight:600;flex:1;min-width:0}
.topic .tname small{display:block;font-weight:400;color:var(--text-dim);font-size:12.5px;margin-top:2px}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap}
.tag.sik{color:var(--sik);border-color:#BDD0EA;background:#F1F6FD}
.tag.yen{color:var(--yen);border-color:#DCC7EA;background:#F8F2FB}
.subs{border-top:1px solid var(--line-soft);padding:6px 8px 10px}
.subrow{
  display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px
}
.subrow:hover{background:var(--surface)}
.subrow .sname{flex:1;min-width:0;font-size:14.5px}
.subrow .sname small{display:block;color:var(--text-dim);font-size:12px}
.subrow button,.mrow button{
  background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 13px;font-size:13px;font-weight:500
}
.subrow button.done{background:var(--ok)}
/* A start row whose kind is the mixed one: present, but not the first choice */
.subrow button.ghost{background:var(--paper);color:var(--text);border:1px solid var(--line)}
/* The concepts / calculations / everything rows at the foot of a topic */
.ksplit{border-top:1px solid var(--line-soft);margin-top:4px;padding-top:5px}
/* The review switch: four modes of one page, so they read as one control */
.review{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 0 14px;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper)}
.rtab{border:0;border-right:1px solid var(--line);background:var(--paper);color:var(--text);
  padding:11px 8px;font-size:14.5px;font-weight:600;text-align:center;line-height:1.25}
.rtab:last-child{border-right:0}
.rtab small{display:block;font-weight:400;font-size:11.5px;color:var(--text-dim);margin-top:2px}
.rtab[aria-pressed="true"]{background:var(--ink);color:#fff}
.rtab[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
@media (max-width:560px){
  .review{grid-template-columns:1fr 1fr}
  .rtab:nth-child(2){border-right:0}
  .rtab:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
/* The stepwise problem sets inside a module, under their own heading */
.stepwise{background:var(--accent-bg);border-radius:8px;margin:6px 10px 10px;padding:10px 8px 8px;border-top:0}
.sethead{margin:2px 8px 2px;font-size:14.5px}
.setnote{font-size:12.5px;color:var(--text-dim);margin:2px 8px 4px;line-height:1.45}
/* The vignette a problem set shares, above the stem of each of its parts */
.cset{font-size:13.5px;color:var(--text-dim);margin:0 0 9px;padding-left:9px;
  border-left:3px solid var(--line)}
/* A sentence that carries an action: styled as text, not as a control */
.linkish{background:0;border:0;padding:0;color:var(--accent);font:inherit;
  text-decoration:underline;cursor:pointer}
.meter{height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;width:64px;flex:none}
.meter{position:relative}
.meter i{display:block;height:100%;background:var(--ok);position:relative;z-index:1}
.meter b{display:block;position:absolute;left:0;top:0;height:100%;background:#9CC4A6}
.counts{font-size:11.5px;color:var(--text-dim);white-space:nowrap;min-width:72px;text-align:left;line-height:1.3}
.meters{display:flex;flex-direction:column;gap:5px;flex:none}
.mrow2{display:flex;align-items:center;gap:8px}
.meter.cov i{background:var(--accent)}
.counts .done{color:var(--ok);font-weight:600;font-style:normal}
@media (max-width:560px){
  /* on a phone the two bars take a line of their own under the name */
  .topic>summary,.subrow,.module>summary,.module .mrow{flex-wrap:wrap}
  .meters{flex-basis:100%;flex-direction:row;flex-wrap:wrap;gap:4px 16px;order:9;padding-left:2px}
  .meters .counts{min-width:0;font-size:11px}.meters .meter{width:56px}
}
.counts em{font-style:normal;font-weight:600}
.session{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:12px 0 4px;font-size:14.5px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 20px}
.tw table.gap{margin-bottom:0}

/* the build stamp under the Topics heading */
.updated{margin:-6px 0 10px;font-size:12.5px;color:var(--text-dim)}

/* ---------- filter bar ---------- */
.filters{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.filters .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters .frow:last-child{margin-bottom:0}
.filters label{font-size:12.5px;color:var(--text-dim);margin-right:2px}
.chip{
  border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--text)
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* a comparison table in a concept block: the rows are what changes, the columns the cases */
.cmpwrap{overflow-x:auto;margin:8px 0 12px}
.cmp{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--paper)}
.cmp th,.cmp td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left;line-height:1.45}
.cmp thead th{background:var(--surface);font-size:13.5px}
.cmp tbody th{background:var(--surface);font-weight:700;min-width:6.5em}
/* On a phone a table with three or four columns cannot fit, and scrolling it
   sideways hides the comparison it exists to show. Each row becomes a card
   instead: its label, then every column's value under that column's name. */
@media (max-width:640px){
  .cmp,.cmp thead,.cmp tbody,.cmp tr,.cmp th,.cmp td{display:block;width:auto}
  .cmp{border:0;background:none}
  .cmp thead{display:none}
  .cmp tr{border:1px solid var(--line);border-radius:8px;margin:0 0 9px;background:var(--paper);overflow:hidden}
  .cmp tbody th{border:0;border-bottom:1px solid var(--line);padding:8px 11px}
  .cmp td{border:0;padding:7px 11px 8px}
  .cmp td+td{border-top:1px dashed var(--line-soft)}
  .cmp td::before{content:attr(data-label);display:block;font-size:12px;font-weight:700;
    color:var(--text-dim);text-transform:none;margin-bottom:1px}
}
@media (max-width:640px){
  .reftab.stack,.reftab.stack thead,.reftab.stack tbody,.reftab.stack tr,.reftab.stack th,.reftab.stack td{display:block;width:auto!important}
  .reftab.stack{border:0;background:none}
  .reftab.stack thead{display:none}
  .reftab.stack tr{border:1px solid var(--line);border-radius:8px;margin:0 0 9px;background:var(--paper);overflow:hidden}
  .reftab.stack td{border:0;padding:7px 11px 8px;overflow-wrap:anywhere}
  .reftab.stack td:first-child{background:var(--surface);border-bottom:1px solid var(--line)}
  .reftab.stack td+td{border-top:1px dashed var(--line-soft)}
  .reftab.stack td:first-child+td{border-top:0}
  .reftab.stack td::before{content:attr(data-label);display:block;font-size:12px;font-weight:700;
    color:var(--text-dim);margin-bottom:1px}
}
/* a note under an explanation: a fact the student needs that does not fit the concept block */
.qnote{margin:13px 0 0;font-size:14.5px;padding:9px 12px;border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:0 6px 6px 0}
/* ---------- stacked fractions, as the slides print them ---------- */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
  margin:0 .18em;line-height:1.25}
.frac>.fn{border-bottom:1.5px solid currentColor;padding:0 .25em .08em}
.frac>.fd{padding:.1em .25em 0}
.reftab td:first-child b{display:inline-block;line-height:1.9;margin:3px 0}
.nw{white-space:nowrap}
.stepwise .meter{background:var(--paper)}

/* ---------- equations ---------- */
#v-eq .eqrow{align-items:flex-start;gap:8px}
#v-eq .eqpick{display:flex;gap:9px;align-items:flex-start;flex:1;min-width:0;cursor:pointer}
#v-eq .eqpick input{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--accent)}
#v-eq .eqline{display:block;font-size:14px;margin:2px 0 1px;color:var(--text)}
#v-eq .must{color:var(--yen)}
#v-eq .eqdone{font-size:11.5px;color:var(--ok);white-space:nowrap;font-weight:600}
#v-eq .module>summary .chip{flex:none}
.eqask{font-size:13.5px;color:var(--text-dim);margin:0 0 12px}
.eqlhs{font-weight:700;white-space:nowrap}
/* the built equation: a row of slots after the left-hand side */
.eqbuild{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:4px 0 14px;font-size:16px}
.eqslot{min-width:52px;min-height:40px;border:2px dashed var(--line);background:var(--surface);
  border-radius:8px;padding:6px 10px;font-size:15px;color:var(--text)}
.eqslot.full{border-style:solid;border-color:var(--accent);background:var(--paper)}
.eqslot.ok{border-color:var(--ok);background:var(--ok-bg)}
.eqslot.bad{border-color:var(--bad);background:var(--bad-bg)}
/* the pieces on offer, correct ones and wrong ones together */
.eqtray{display:flex;flex-wrap:wrap;gap:7px;padding:11px;border:1px solid var(--line-soft);
  border-radius:10px;background:var(--surface)}
.eqtile{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;
  font-size:15px;color:var(--text);cursor:grab}
.eqtile.used{opacity:.32;cursor:default}
.eqtype{display:flex;align-items:center;gap:9px;margin:4px 0 6px;flex-wrap:wrap}
.eqtype input{flex:1;min-width:190px;padding:11px 12px;font-size:16px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper);color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace}
.eqtype input.ok{border-color:var(--ok)}
.eqtype input.bad{border-color:var(--bad)}
.eqhint{margin:0 0 6px}
.eqhint code,.why code{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;
  padding:1px 5px;font-size:13px}
.eqanswer{font-size:16px;margin:0 0 12px}

/* ---------- quiz ---------- */
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qhead{
  padding:9px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-dim)
}
.qhead .spacer{flex:1}
.qbody{padding:16px}
.tdimg{margin:2px 0 10px;background:#fff;border:1px solid var(--line-soft);border-radius:6px}
.qprog{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line-soft);
  font-size:12px;color:var(--text-dim);background:var(--surface)}
.qprog .pbar{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:60px}
.qprog .pbar i{display:block;height:100%;background:var(--ok)}
.stem{font-size:17px;line-height:1.5;margin:0 0 14px}
.stem p,.wstem p,.mstem p{margin:0 0 10px} .stem p:last-child,.wstem p:last-child,.mstem p:last-child{margin-bottom:0}
.stemtab{border-collapse:collapse;font-size:14.5px;margin:2px 0 4px;background:var(--paper)}
.stemtab th,.stemtab td{border:1px solid var(--line);padding:5px 12px;text-align:right}
.stemtab th{background:var(--surface);font-size:13px;font-weight:600;text-align:center}
.qimg{width:100%;background:#fff;border:1px solid var(--line-soft);border-radius:8px;margin:0 0 14px;display:block}
.opt{
  display:flex;gap:11px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:9px;
  font-size:15px;line-height:1.45;color:var(--text)
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.opt .k{
  flex:none;width:23px;height:23px;border-radius:5px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--text-dim)
}
.opt.pick-ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.pick-ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.pick-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.pick-bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.reveal-ok{border-color:var(--ok)}
.opt.reveal-ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}

/* ---------- select-all questions ---------- */
.sata{margin:0 0 10px;font-size:13px;color:var(--text-dim);padding:7px 11px;background:var(--surface);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.opt.multi .k{font-size:17px;line-height:1;background:transparent;border-color:var(--line)}
.opt.multi.on{border-color:var(--accent);background:var(--accent-bg)}
.opt.multi.on .k{color:var(--accent);border-color:var(--accent)}
.opt.multi.pick-ok .k,.opt.multi.reveal-ok .k{background:var(--ok);color:#fff}
.opt.multi.pick-bad .k{background:var(--bad);color:#fff}
.tag.sata{color:#7A46B0;border-color:#DCC7EA;background:#F8F2FB}
.youpicked{font-style:normal;font-size:11.5px;color:var(--text-dim);margin-left:4px}

/* ---------- weak spots: what to do next ---------- */
.nextgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px;margin:0 0 22px}
.nextcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.nexthead{display:flex;flex-direction:column;gap:2px;margin-bottom:9px}
.nexthead b{font-size:14.5px}
.nexthead span{font-size:12px;color:var(--text-dim)}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;
  border-top:1px dashed var(--line-soft);font-size:13.5px}
.nextrow i{font-style:normal;color:var(--text-dim);font-size:12.5px}
.btn.small{padding:6px 11px;font-size:13px}
.opt:disabled{cursor:default;opacity:1}

.why{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:14px}
.why .verdict{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.why .verdict.ok{color:var(--ok)} .why .verdict.bad{color:var(--bad)}
.wrow{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line-soft)}
.wrow:first-of-type{border-top:0}
.wrow .mark{flex:none;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.wrow .mark.y{background:var(--ok)} .wrow .mark.n{background:var(--bad)}
.wrow .wtxt{font-size:14.5px;line-height:1.55}
.wrow .wtxt b{font-weight:600}
.teach{margin-top:14px;background:var(--accent-bg);border:1px solid #CFDDF0;border-radius:9px;padding:13px 15px}
.teach h4{margin:0 0 7px;font-size:13px;color:var(--accent);font-weight:600}
.teach p{margin:0;font-size:15px;line-height:1.62}
.tdiag{background:#fff;border:1px solid #CFDDF0;border-radius:7px;padding:10px;margin:0 0 11px;overflow-x:auto}
.tdiag svg{display:block;max-width:100%;height:auto;margin:0 auto}
.quote{display:block;font-style:italic;color:var(--text);margin-bottom:6px;font-size:13px}
.cite{
  margin-top:13px;font-size:12.5px;color:var(--text-dim);background:var(--surface);
  border-left:3px solid var(--line);padding:9px 11px;border-radius:0 7px 7px 0
}
.cite .srcflag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;
  background:var(--warn-bg);color:var(--warn);border:1px solid #E8CFA2}
.qfoot{padding:12px 14px;border-top:1px solid var(--line-soft);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 17px;font-size:15px;font-weight:500}
.btn.ghost{background:var(--paper);color:var(--text);border:1px solid var(--line)}
.btn.amber{background:var(--warn-bg);color:var(--warn);border:1px solid #E8CFA2}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- dashboard ---------- */
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;flex:1;min-width:110px}
.stat b{display:block;font-size:25px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--text-dim)}
table.gap{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
table.gap th,table.gap td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-soft)}
table.gap th{background:var(--surface);font-size:12.5px;color:var(--text-dim);font-weight:600}
table.gap tr:last-child td{border-bottom:0}
.bar{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}
.missq{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;margin-bottom:9px}
.missq .mstem{font-size:14.5px;margin-bottom:6px}
.missq .mmeta{font-size:12px;color:var(--text-dim)}

/* ---------- exam ---------- */
.examhead{background:var(--ink);color:#fff;border-radius:var(--r);padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.examhead .clock{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}
.examhead .clock.low{color:#FF9A8F}
.examhead .prog{font-size:13px;color:#9FB0C4;margin-left:auto}

/* ---------- misc ---------- */
.note{background:var(--warn-bg);border:1px solid #E8CFA2;color:#6B4200;border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.note b{color:#6B4200}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--text-dim)}
.reftab{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);font-size:13.5px;margin-bottom:20px}
.reftab th,.reftab td{border:1px solid var(--line-soft);padding:8px 10px;text-align:left;vertical-align:top}
.reftab th{background:var(--surface);font-size:12.5px;font-weight:600}
.sweepcard{border-color:var(--accent);background:var(--accent-bg)}
/* ---------- topics: module groups ---------- */
.module{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.module>summary{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;list-style:none;font-size:16px;font-weight:700}
.module>summary::-webkit-details-marker{display:none}
.module>summary::before{content:"\25BE";color:var(--text-dim);font-size:13px;transition:transform .15s}
.module:not([open])>summary::before{transform:rotate(-90deg)}
.module .mname{flex:1;min-width:0}
.module .mname small{display:block;font-weight:400;color:var(--text-dim);font-size:12.5px;margin-top:2px}
.module .topic{margin:0 10px 10px;border-radius:8px}
.examgrp{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.examgrp>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px;cursor:pointer;list-style:none;font-size:18px;font-weight:800}
.examgrp>summary::-webkit-details-marker{display:none}
.examgrp>summary::before{content:"\25BE";color:var(--text-dim);font-size:14px;transition:transform .15s;align-self:flex-start;margin-top:5px}
.examgrp:not([open])>summary::before{transform:rotate(-90deg)}
.examgrp>summary .mname{flex:1;min-width:0}
.examgrp>summary .mname small{display:block;font-weight:400;color:var(--text-dim);font-size:12.5px;margin-top:2px}
.examgrp .egbody{padding:0 10px 2px}
.examgrp .egbody>.module{background:var(--surface)}
.recapcard{border-style:dashed}
.recapcard .mrow{padding:12px 14px 4px}
.module .mfoot{border-top:1px solid var(--line-soft);padding:6px 8px 10px;margin:0 10px 4px}
.module .mrow{display:flex;align-items:center;gap:10px;padding:13px 14px;font-size:16px;font-weight:700}
/* ---------- guides: what she said ---------- */
ul.saidlist{list-style:none;margin:6px 0 0;padding:0}
.said{margin:0 0 12px;padding:0}
.said .lead{display:block;font-weight:600;font-size:13.5px;margin-bottom:3px}
.said q{display:block;quotes:none;font-family:Georgia,"Iowan Old Style","Source Serif 4",serif;font-size:14.5px;line-height:1.55;
  margin:4px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0 6px 6px 0}
.said q.para{border-left-style:dashed}
.said .when{display:block;font-size:11.5px;color:var(--text-dim);letter-spacing:.02em;margin-top:2px}
.sweepcard .subs{border-top:0}
.sweepcard .subrow:hover{background:rgba(255,255,255,.5)}
/* objective guides */
.gobj{margin:0 0 34px;padding:0 0 22px;border-bottom:2px solid var(--line)}
.gobj h3{margin:26px 0 10px;font-size:19px}
.gobj h4{margin:20px 0 8px;font-size:14.5px;color:var(--accent);letter-spacing:.01em}
.gbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;background:var(--accent);color:#fff;border-radius:8px;padding:9px 14px;margin:0 0 6px}
.gbar span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.gbar b{font-size:15px}
.gbar i{margin-left:auto;font-size:12.5px;opacity:.9}
.gwords{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:5px 14px;margin:0 0 10px;font-size:13.5px}
.gwords dt{font-weight:600}
.gwords dd{margin:0;color:var(--text)}
.gobj .prose{font-size:14.5px;margin:0 0 10px}
.gobj .reftab{margin:8px 0 14px}
.gobj .reffig img{max-width:620px;width:100%}
.ghook,.gpoll,.gask{border:1px solid;border-radius:9px;padding:11px 14px;margin:14px 0;font-size:14px;line-height:1.55}
.ghook{border-color:#d9822b;background:rgba(217,130,43,.08)}
.gpoll{border-color:#3b62c4;background:rgba(59,98,196,.07)}
.gask{border-color:#2f8f5b;background:rgba(47,143,91,.07)}
.ghook>b,.gpoll>b,.gask>b{display:block;margin-bottom:4px}
.gask ul{margin:6px 0 6px 18px;padding:0}
.gask li{margin:3px 0}
@media (max-width:600px){.gwords{grid-template-columns:1fr}.gwords dd{margin:0 0 6px 10px}}
.refnav-wrap{margin:0 0 20px;border:1px solid var(--line-soft);border-radius:8px;background:var(--surface)}
.refnav-wrap summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--accent);list-style:none}
.refnav-wrap summary::-webkit-details-marker{display:none}
.refnav-wrap summary::before{content:"\25B8  ";font-size:11px}
.refnav-wrap[open] summary::before{content:"\25BE  "}
.refnav{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:4px 14px 14px}
.refnav a{font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);color:var(--text);text-decoration:none;white-space:nowrap}
.refnav a:hover{background:var(--line-soft)}
.reffig{margin:0 0 20px;padding:0}
.reffig img{width:100%;max-width:760px;display:block;border:1px solid var(--line-soft);border-radius:6px;background:#fff}
.reffig figcaption{font-size:12.5px;color:var(--text-dim);margin-top:6px}
#v-ref h3{scroll-margin-top:12px}
input[type=text]{font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text)}
.kbd{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
@media (max-width:560px){
  main{padding:14px 11px 80px}
  .stem{font-size:16px}
  header h1{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
:focus-visible{outline:3px solid #6FA0E8;outline-offset:2px}

/* ---------- numeric questions ---------- */
.numrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 14px}
.numrow input.numin{font:inherit;font-size:17px;padding:9px 12px;width:190px;
  border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--text)}
.numrow .units{font-size:15px;color:var(--text-dim)}
.numrow.ok input.numin{border-color:var(--ok);background:var(--ok-bg)}
.numrow.bad input.numin{border-color:var(--bad);background:var(--bad-bg)}
.misskind{border:1px solid var(--warn);background:var(--warn-bg);border-radius:var(--r);
  padding:12px 14px;margin:0 0 14px}
.misskind p{margin:0 0 9px;font-size:13.5px;color:#6B4200}
.misskind .frow{display:flex;gap:7px;flex-wrap:wrap}
.misskind button{font-size:13.5px;padding:6px 12px;border:1px solid var(--line);
  border-radius:999px;background:var(--paper);color:var(--text)}
.misskind button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{margin:14px 0 0;border-top:1px solid var(--line-soft);padding-top:12px}
.steps h4{margin:0 0 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.step:last-child{border-bottom:0}
.step .stepk{flex:0 0 auto;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-dim);background:var(--surface);border:1px solid var(--line-soft);
  border-radius:999px;padding:2px 8px;margin-top:2px;min-width:62px;text-align:center}
.step .stept{font-size:15px}
.step .stepwhy{display:block;margin-top:3px;font-size:13.5px;color:var(--text-dim);line-height:1.5}

/* ---------- match questions ---------- */
.matchgrid{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:9px 12px;margin:0 0 14px;align-items:center}
.matchgrid .mleft{font-size:15px;font-weight:600}
.matchgrid select{font:inherit;font-size:14.5px;padding:8px 10px;width:100%;max-width:100%;min-width:0;
  border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--text)}
.matchgrid select.ok{border-color:var(--ok);background:var(--ok-bg)}
.matchgrid select.bad{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:560px){.matchgrid{grid-template-columns:1fr}}
.pairrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.pairrow:last-child{border-bottom:0}
.pairrow .pl{font-weight:600;font-size:14px;flex:0 0 auto;min-width:110px}
.pairrow .pr{font-size:14px}
.pairrow .pr span{display:block;margin-top:3px;font-size:13.5px;color:var(--text-dim);line-height:1.5}

/* ---------- exam blueprint shortfall ---------- */
.shortfall{background:var(--bad-bg);border:1px solid #E9B8B4;color:#7A1C16;
  border-radius:var(--r);padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.shortfall b{color:#7A1C16}

/* ---------- what's new ---------- */
.news{background:var(--paper);border:1px solid var(--line-soft);border-left:4px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin:0 0 14px}
.news .newshead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.news .newshead span,.news .newsmore{font-size:12.5px;color:var(--text-dim);margin:0 0 6px}
.news ul{margin:6px 0 8px;padding-left:20px;font-size:14px} .news li{margin:2px 0}
.newsbtns{display:flex;gap:8px;flex-wrap:wrap}
.changelog ul{margin:2px 0 10px;padding-left:20px;font-size:14px} .changelog p{margin:6px 0 0;font-size:14px}
.countdown{white-space:nowrap}

/* ---------- this session, review plan ---------- */
.sessline{font-size:13px;color:var(--text-dim);margin:0 0 8px}
.sdots10{display:inline-flex;gap:3px;vertical-align:middle;flex-wrap:wrap}
.sdots10 i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--ok);background:var(--ok)}
.sdots10 i.n{background:transparent;border-color:var(--bad)} .sdots10.big i{width:14px;height:14px}
.sesscard,.plan{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 14px;margin:0 0 12px}
.sesstop{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:8px;font-size:14px;color:var(--text-dim)}
.sesstop .big{font-size:22px;color:var(--text)}
.sesshint{font-size:12.5px;color:var(--text-dim);margin:6px 0 8px}
.planhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.planhead span,.pmore{font-size:12.5px;color:var(--text-dim);margin:2px 0 0}
.pconcept{border-top:1px solid var(--line-soft);padding:8px 0 6px;margin-top:8px;font-size:14px;overflow-wrap:anywhere}
.pconcept .pq{font-weight:600;margin-bottom:4px} .pconcept .pw{color:var(--bad);margin:2px 0}
.pconcept .pwhy{display:block;color:var(--text-dim);font-size:13px;margin-top:2px}
.pconcept .pr{color:var(--ok);margin:2px 0} .pconcept .pi{margin:2px 0}
.planbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}

/* ---------- step-through figures, diagrams ---------- */
.stepfig .stsvg svg{width:100%;max-width:760px;height:auto;display:block;border:1px solid var(--line-soft);border-radius:6px;background:#fff}
.stepfig .st{display:none} .stepfig .st.on{display:inline}
.stepfig .st-out{pointer-events:none;animation:stOut .5s ease forwards} .stepfig .st .fadein{animation:stIn .5s ease backwards}
.stepfig .st .glide{transition:transform .9s ease}
@keyframes stIn{from{opacity:0}} @keyframes stOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.stepfig .st-out{display:none} .stepfig .st .fadein{animation:none} .stepfig .st .glide{transition:none}}
.anim{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px}
.sdots{display:inline-flex;gap:6px;align-items:center;margin-left:auto}
.sdot{width:12px;height:12px;border-radius:50%;background:var(--line);border:none;padding:0;cursor:pointer}
.sdot.on{background:var(--accent)} .sdot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stcap{display:none;font-size:14.5px;margin:4px 0 6px} .stcap.on{display:block}
.dgtoc{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 14px;margin:0 0 10px}
.dgchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dgchips .chip{text-decoration:none;max-width:100%;white-space:normal}
.dgfig{margin:0 0 22px;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 14px}
.dgfig .reffig{margin:8px 0 6px}
.dghead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.dghead b{font-size:16px} .dghead span{font-size:12px;color:var(--text-dim)}
.readgraph{border-top:1px solid var(--line-soft);margin-top:8px;padding-top:8px}
.readgraph h4{margin:0 0 4px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.readgraph ol{margin:0;padding-left:20px} .readgraph li{margin:4px 0;font-size:14.5px;line-height:1.5}
.dquote{font-style:italic;color:var(--text-dim);font-size:13.5px;margin:8px 0 0;border-left:3px solid var(--line);padding-left:10px}
.dgintro{background:var(--accent-bg);border-radius:var(--r);padding:10px 14px;margin:0 0 12px}
.dgintro p{margin:0 0 4px} .dgintro ol{margin:0 0 4px;padding-left:20px} .dgintro li{margin:3px 0;font-size:14.5px}

/* ---------- terms ---------- */
.termcard{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.termcard .tgist{margin:4px 0 6px;font-size:15px}
.tsearch{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 12px;margin:0 0 12px}
.tsearch input{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);margin-bottom:8px}
.azbar{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.az{min-width:28px;padding:4px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
.az:disabled{opacity:.35;cursor:default}
.flash .fcscene{font-size:16px} .flash .fcterm{font-size:20px;font-weight:700;margin:10px 0 2px;color:var(--accent)}
#tback{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;white-space:nowrap;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25)}
body:has(#backbtn) #xback, body:has(#backbtn) #tback{bottom:64px}

/* ---------- explain more ---------- */
.explainmore{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0;font-size:13px;color:var(--text-dim)}
.explainmore .chip{white-space:normal;text-align:left}
#backbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap}

/* ---------- answer layout ---------- */
.laytog{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--text-dim)}
.laytog .chip{font-size:12.5px;padding:4px 10px}
.laywrap{margin:4px 0 10px}
.sessline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.allhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin:2px 0 4px}
.allhead span{font-size:13px;color:var(--text-dim)}
.allcard{margin-bottom:14px}
.examhead.sticky{position:sticky;top:90px;z-index:30}

/* ---------- enlarged figure ---------- */
.reffig img,img.qimg{cursor:zoom-in}
#zoom{position:fixed;inset:0;background:rgba(10,16,24,.88);z-index:100;overflow:auto;-webkit-overflow-scrolling:touch;padding:56px 0 20px}
#zoom img{display:block;width:max(760px,100vw);max-width:none;background:#fff;margin:0 auto}
#zoomx{position:fixed;top:10px;right:10px;z-index:101}

/* ---------- module cards and module pages ---------- */
.modcard .mrow{padding-bottom:6px}
.modbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:0 14px 14px}
.modbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--accent-bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);min-height:64px}
.modbtn:hover{border-color:var(--accent)}
.modbtn b{font-size:16px;color:var(--accent)} .modbtn small{font-size:12.5px;color:var(--text-dim)}
.modbtn .meter{width:100%;margin-top:4px}
.crumb{margin:0 0 4px} .linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-size:14.5px}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.mtab{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14.5px;color:var(--text)}
.mtab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.topic.plain{margin-bottom:12px}
.subrow .btns{display:flex;gap:6px;flex:none}
.objn{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ctype{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.ctop{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .ctop .sname{flex:1;min-width:0;font-size:15px}
.ctop .sname small{display:block;color:var(--text-dim);font-size:12px}
.cbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.worked{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:6px}
.worked>summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;padding:4px 0}
.wbody{padding:4px 0 2px} .wstem{font-size:14.5px;margin:4px 0 8px} .wans{margin:8px 0 2px;font-size:14.5px}
.wcite{font-size:12px;color:var(--text-dim);margin:2px 0 0}
.morefilters{margin:14px 0 4px} .morefilters>summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
@media (max-width:560px){.subrow .btns{flex-basis:100%;order:10}}

/* ---------- dark theme ----------
   System follows the device; Light or Dark in the header overrides it. The
   same values are written twice: once for System when the device is dark,
   once for an explicit Dark choice. Drawn figures (SVG) are inverted with the
   hue kept, so their blue and amber stay blue and amber; lecture slides are
   photographs of the deck and keep their white page. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ink:#0B1118; --ink-2:#141D27; --paper:#18212B; --surface:#10161D;
  --line:#33404F; --line-soft:#26303C;
  --text:#E4EAF1; --text-dim:#9FAEBE;
  --ok:#5DC58C; --ok-bg:#15301F; --bad:#F2837A; --bad-bg:#3A1B19;
  --warn:#E7AE55; --warn-bg:#33270F; --accent:#86AEEC; --accent-bg:#1A2840;
  --sik:#86AEEC; --yen:#C99BE6; --sel:#3B5C90;}
:root:not([data-theme="light"]) .teach{border-color:#2C3F5C}
:root:not([data-theme="light"]) .teach .prose+h5.tsec{border-top-color:rgba(255,255,255,.08)}
:root:not([data-theme="light"]) .tdiag,:root:not([data-theme="light"]) .tdimg,:root:not([data-theme="light"]) .qimg{background:var(--paper)}
:root:not([data-theme="light"]) .tag.sik{border-color:#2C4466;background:#16243A}
:root:not([data-theme="light"]) .tag.yen,:root:not([data-theme="light"]) .tag.sata{border-color:#4A3560;background:#251B30;color:#C99BE6}
:root:not([data-theme="light"]) .meter b{background:#3D6B4D}
:root:not([data-theme="light"]) .note{border-color:#5A4520;color:#F0CB8E} :root:not([data-theme="light"]) .note b{color:#F0CB8E}
:root:not([data-theme="light"]) .misskind p{color:#F0CB8E}
:root:not([data-theme="light"]) .shortfall{border-color:#6A2C27;color:#F4A59E} :root:not([data-theme="light"]) .shortfall b{color:#F4A59E}
:root:not([data-theme="light"]) .btn.amber,:root:not([data-theme="light"]) .warnbtn{border-color:#5A4520}

  <section id="v-ref" class="hide"></section>
  <section id="v-settings" class="hide"></section>
</main>


<script>
/* ==========================================================================
   DATA  (injected at build time)
   ==========================================================================
   course.js is concatenated FIRST, so COURSE is in scope for everything
   below. The three placeholder declarations are replaced wholesale by
   build.py with course.js + images.json + every question file.
   ========================================================================== */
const IMAGES = /*__IMAGES__*/{};
const QUESTIONS = /*__QUESTIONS__*/[];
const TOPICS = /*__TOPICS__*/[];

/* The markup carries a neutral fallback title so the file is never nameless if
   the script fails; the course's own name is written over it here. */
try {
  document.title = COURSE.title;
  const h1 = document.querySelector('header h1');
  if (h1) h1.textContent = COURSE.short;
} catch (e) {}

/* ==========================================================================
   THE EXAM BLUEPRINT
   ==========================================================================
   One active exam, taken from COURSE. Its pools are the blueprint: each pool
   claims a number of marks and selects its questions with a filter object
   matched against question fields. Every key must match; an array value means
   "one of". Nothing here knows what a professor, a module or a tier is.
   ========================================================================== */
let EXAM = null, POOLS = [], TOTAL_MARKS = 0, EXAM_SATA = 0;
/* Which paper the drill is preparing for. COURSE.activeExam is the default;
   a student can choose another (Exam view or Settings), and the choice is
   kept with their progress. Every pool, weight and draw below follows it. */
function setActiveExam(id){
  EXAM = COURSE.exams.find(e => e.id === id)
      || COURSE.exams.find(e => e.id === COURSE.activeExam) || COURSE.exams[0];
  POOLS = (EXAM && EXAM.pools) || [];
  TOTAL_MARKS = POOLS.reduce((s, p) => s + (p.marks || 0), 0);
  EXAM_SATA = (EXAM && EXAM.sata) || 0;
  invalidatePools();
}

function matchesPoolFilter(q, f){
  for(const k in (f || {})){
    const want = f[k], have = q[k];
    if(Array.isArray(want)){ if(!want.includes(have)) return false; }
    else if(have !== want) return false;
  }
  return true;
}
/* The first pool a question falls into. A question matching no pool is not on
   the blueprint and is worth no marks. Two pools whose filters overlap do not
   double-count: a question belongs to the first one that claims it. */
function poolOf(q){ return POOLS.find(p => matchesPoolFilter(q, p.filter)) || null; }

/* Questions currently in a pool. Computed from the bank rather than written
   down, so the marks weighting below follows the bank as it grows; cached only
   so a render pass does not walk the bank once per question. */
let _poolCache = null;
function poolQuestions(p){
  if(!_poolCache) _poolCache = new Map();
  if(!_poolCache.has(p)) _poolCache.set(p, QUESTIONS.filter(q => poolOf(q) === p));
  return _poolCache.get(p);
}
function invalidatePools(){ _poolCache = null; }
setActiveExam(COURSE.activeExam);
const poolKey = q => { const p = poolOf(q); return p ? p.key : '(off blueprint)'; };

/* What one question in a pool is worth on the paper: the pool's share of the
   marks divided by how many questions the pool currently holds. A miss in a
   small pool that supplies many marks therefore costs more than a miss in a
   large pool that supplies few. */
function markWeight(q){
  const p = poolOf(q);
  if(!p) return 0;
  const n = poolQuestions(p).length;
  return n ? (p.marks || 0) / n : 0;
}

/* How many questions each pool contributes to a paper of EXAM.questions, in
   proportion to its marks. The largest-remainder method so the shares add up
   to the paper size exactly rather than drifting by a question. */
function poolShares(){
  const n = EXAM ? EXAM.questions : 0;
  if(!TOTAL_MARKS) return POOLS.map(p => ({pool:p, want:0}));
  const raw = POOLS.map(p => n * (p.marks || 0) / TOTAL_MARKS);
  const out = raw.map((r, i) => ({pool:POOLS[i], want:Math.floor(r), frac:r - Math.floor(r)}));
  let left = n - out.reduce((s, o) => s + o.want, 0);
  out.slice().sort((a, b) => b.frac - a.frac).forEach(o => { if(left > 0){ o.want++; left--; } });
  return out.map(o => ({pool:o.pool, want:o.want}));
}

/* The questions a pool can actually put on a paper. lowYield items are asides
   that were never polled or listed for review, so they stay off. */
function poolDrawable(p){ return poolQuestions(p).filter(q => !q.lowYield); }

/* How many select-all items each pool contributes.
 *
 * The naive split — each pool's share of EXAM.sata in proportion to its marks,
 * rounded — loses items twice over: a pool that rounds to 1 but holds 2 leaves
 * one behind, and a pool that rounds to 1 but holds none simply drops its
 * share. The paper then carries fewer select-all items than the bank could
 * supply, which understates how much of the paper is marked all-or-nothing.
 *
 * So the target is first capped at what the bank can actually give — no pool
 * can supply more select-all items than it holds, or than it has places on the
 * paper — and the capped total is then handed out one item at a time to
 * whichever pool has the largest unmet proportional claim and still has room.
 * The result takes every select-all item available, up to the target, and
 * never takes one from a pool at the cost of that pool's question count.
 */
function sataShares(shares){
  const cap = shares.map(({pool, want}) =>
    Math.min(want, poolDrawable(pool).filter(isMulti).length));
  const totalCap = cap.reduce((a, b) => a + b, 0);
  const n = Math.min(EXAM_SATA, totalCap);
  const raw = shares.map(({pool}) => TOTAL_MARKS ? n * (pool.marks || 0) / TOTAL_MARKS : 0);
  const got = raw.map((r, i) => Math.min(cap[i], Math.floor(r)));
  let left = n - got.reduce((a, b) => a + b, 0);
  while(left > 0){
    let best = -1, bestClaim = -Infinity;
    for(let i = 0; i < got.length; i++){
      if(got[i] >= cap[i]) continue;              // this pool has no more to give
      const claim = raw[i] - got[i];              // how far short of its share it is
      if(claim > bestClaim){ bestClaim = claim; best = i; }
    }
    if(best < 0) break;                           // every pool is at its cap
    got[best]++; left--;
  }
  return {per: got, target: EXAM_SATA, available: totalCap, drawn: got.reduce((a, b) => a + b, 0)};
}

/* ==========================================================================
   QUESTION TYPES
   ==========================================================================
   'mc'      multiple choice, one keyed option, or multi:true for select-all
   'numeric' a typed number graded against `answer` within `tol`
   'match'   one select per left item, graded all-or-nothing
   A question with no `type` is multiple choice, so the original bank format
   keeps working untouched.
   ========================================================================== */
const qType = q => q.type || 'mc';
const isMC  = q => qType(q) === 'mc';
const isMulti = q => isMC(q) && !!q.multi;
const correctSet = q => (q.options || []).map((o, i) => o.correct ? i : -1).filter(i => i >= 0);
function gradeMulti(q, picks){
  const want = correctSet(q), got = (picks || []).slice().sort((a, b) => a - b);
  return want.length === got.length && want.every((v, i) => v === got[i]);
}
/* The student's entry is compared exactly as typed, with no rounding of their
   number: only the tolerance decides. A blank or unreadable entry is wrong. */
function parseNum(entered){
  if(entered === null || entered === undefined) return NaN;
  const t = String(entered).trim().replace(/,/g, '');
  if(!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t)) return NaN;
  return parseFloat(t);
}
/* The comparison is |entered - answer| <= tol, with one caveat. Binary floating
   point cannot hold most decimal tolerances exactly, so a student who types the
   number sitting exactly on the stated boundary — 14.4857 against an answer of
   14.2857 with a tolerance of 0.2 — can produce a difference that reads as
   0.20000000000000018 and be marked wrong for a rounding error the machine
   made, not one they made. A relative slack of one part in a billion absorbs
   that. It is far below any tolerance a question would set, so it cannot let a
   genuinely wrong answer through. */
const FP_SLACK = 1e-9;
function gradeNumeric(q, entered){
  const v = parseNum(entered);
  if(!isFinite(v)) return false;
  return Math.abs(v - q.answer) <= q.tol + Math.abs(q.tol) * FP_SLACK;
}
/* `picks` maps a left item to the right item chosen for it. Right only when
   every keyed pair is matched. */
function gradeMatch(q, picks){
  const p = picks || {};
  return (q.pairs || []).length > 0 && (q.pairs || []).every(pr => p[pr.l] === pr.r);
}
/* One entry point the quiz, the exam and the checks all grade through. */
function gradeAnswer(q, picked){
  if(qType(q) === 'numeric') return gradeNumeric(q, picked);
  if(qType(q) === 'match')   return gradeMatch(q, picked);
  if(isMulti(q))             return gradeMulti(q, picked);
  return picked !== null && picked !== undefined && !!(q.options[picked] || {}).correct;
}
const isBlank = (q, p) => qType(q) === 'numeric' ? !String(p == null ? '' : p).trim()
                        : qType(q) === 'match'   ? !(p && Object.keys(p).length)
                        : isMulti(q)             ? !(Array.isArray(p) && p.length)
                        : (p === null || p === undefined);

/* The four ways a calculation goes wrong. The student picks one after a missed
   numeric question, and Weak spots totals them, so a student losing marks to
   unit conversion rather than to the pharmacokinetics can see that. */
const MISS_KINDS = [
  {id:'setup',   label:'Set-up',           hint:'picked the wrong equation, or put a quantity in the wrong place'},
  {id:'unit',    label:'Unit conversion',  hint:'the arithmetic was right but the units were not'},
  {id:'algebra', label:'Algebra',          hint:'the rearrangement or the arithmetic slipped'},
  {id:'round',   label:'Rounding',         hint:'the working was right and the reported figure was not'},
];
const MISS_LABEL = Object.fromEntries(MISS_KINDS.map(m => [m.id, m.label]));

/* ==========================================================================
   STORAGE — namespaced per profile so several people can share one browser
   ========================================================================== */
const NS = COURSE.ns;

/* localStorage is not always reachable. Opening this file from disk can give
   the page an opaque origin, and a private window or blocked site data does the
   same, in which case even reading localStorage throws a SecurityError. That
   throw used to happen while the script was still evaluating, which killed the
   whole app and left a blank page. Everything now goes through this shim: when
   storage is unavailable the drill still runs for the session, and only the
   saving of progress is lost. */
const LS = (() => {
  let ok = true;
  try { const k = NS + ':probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); }
  catch(e) { ok = false; }
  const mem = {};
  return {
    available: ok,
    get(k){ try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); }
            catch(e){ return null; } },
    set(k, v){ try { if(ok) localStorage.setItem(k, v); else mem[k] = v; return true; }
               catch(e){ mem[k] = v; return false; } },
  };
})();

let PROFILE = LS.get(NS + ':profile') || '';
const keyFor = p => NS + ':data:' + p;

const DEFAULT_MODE = COURSE.paceDefault === 'cram' ? 'cram'
                   : COURSE.paceDefault === 'all'  ? 'all' : 'long';

const BLANK = () => ({
  concepts:{},        // conceptId -> {seen,correct,wrong,guessed,streak,box,dueAt,dueQ,lastQ,asked:[]}
  answers:[],         // {qid,concept,result,at,qn,picked,ms,missKind}
                      //   picked: option index, a sorted array of indices for a
                      //   select-all question, the string entered for a numeric
                      //   one, or the left->right map for a match.
                      //   missKind: which kind of slip a missed numeric was.
  eq:{},              // equationId -> {seen,right,wrong,streak,mode,at} for the equation drill
  exams:[],           // every practice paper sat: {at, exam, right, total, blank}
  qn:0,               // questions answered counter (drives cram scheduling)
  settings:{mode:DEFAULT_MODE},
  created:Date.now()
});
let DB = BLANK();

function load(){
  if(!PROFILE) return;
  try{
    const raw = LS.get(keyFor(PROFILE));
    DB = raw ? Object.assign(BLANK(), JSON.parse(raw)) : BLANK();
  }catch(e){ DB = BLANK(); }
  setActiveExam(DB.settings.exam || COURSE.activeExam);
}
let saveTimer=null;
function save(){
  if(!PROFILE) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    LS.set(keyFor(PROFILE), JSON.stringify(DB));
  },150);
}
/* No name is asked for. Progress is saved under the profile last used in this
   browser, or "default" on a first visit. Someone sharing the browser can type
   another profile name on the Settings page; that is optional, never a pop-up.
   askProfile() keeps its name so the checks that call it still work. */
function setProfile(name){
  PROFILE = String(name || '').trim() || 'default';
  LS.set(NS+':profile', PROFILE);
  load();
  const who = document.getElementById('whoName');
  if(who) who.textContent = (PROFILE === 'default' ? '' : PROFILE) + (LS.available ? '' : ' (progress not saved)');
}
function askProfile(){ setProfile(PROFILE || 'default'); }

/* ==========================================================================
   SPACED REPETITION
   Rules implemented:
     1 correct  -> longer interval each time, never retired permanently
     2 wrong    -> stays in active review, resurfaces after >=GAP other questions,
                   prefers a DIFFERENT question on the same concept
     3 guessed  -> treated as not-yet-understood: box drops to 0 so it ranks
                   with missed concepts, ahead of never-seen material
     4 spaced   -> mastered material returns at growing intervals
     5 priority -> wrong > due > never-seen > recently mastered
     6 concept-level tracking, not wording-level
     7 mastery  -> needs repeated correct answers on separate occasions
   ========================================================================== */
const GAP = 4;                                   // min other questions before a missed concept returns
const DAYS = [0, 1, 3, 7, 14, 30, 60];           // long-term schedule (box index -> days)
const CRAM = [0, 8, 20, 45, 90, 160, 260];       // cram schedule (box index -> questions answered)
const MASTER_BOX = 3;                            // box at/above which a concept counts as mastered

function st(concept){
  if(!DB.concepts[concept]){
    DB.concepts[concept] = {seen:0,correct:0,wrong:0,guessed:0,streak:0,box:0,
                            dueAt:0,dueQ:0,lastQ:-999,asked:[]};
  }
  return DB.concepts[concept];
}
const cram = () => (DB.settings.mode||DEFAULT_MODE) === 'cram';

function schedule(s){
  const b = Math.max(0, Math.min(s.box, DAYS.length-1));
  s.dueQ  = DB.qn + CRAM[b];
  s.dueAt = Date.now() + DAYS[b]*86400000;
}
function isDue(s){
  return cram() ? (DB.qn >= s.dueQ) : (Date.now() >= s.dueAt);
}
function record(q, result, picked, ms, missKind){   // result: 'correct' | 'wrong' | 'guessed'
  const s = st(q.concept);
  DB.qn++;
  s.seen++;
  s.lastQ = DB.qn;
  if(!s.asked.includes(q.id)) s.asked.push(q.id);

  if(result === 'correct'){
    s.correct++; s.streak++;
    s.box = Math.min(s.box + 1, DAYS.length - 1);
  }else if(result === 'guessed'){
    s.guessed++;                     // the right pick, but not understood
    s.streak = 0;
    s.box = 0;                       // rule 3: a guess is a gap, so it ranks with misses
  }else{
    s.wrong++; s.streak = 0;
    s.box = 0;                       // rule 4: a miss resets to active review
  }
  schedule(s);
  const entry = {qid:q.id, concept:q.concept, result, at:Date.now(), qn:DB.qn};
  if(picked !== undefined && picked !== null) entry.picked = picked;
  if(ms) entry.ms = ms;
  if(missKind) entry.missKind = missKind;
  DB.answers.push(entry);
  if(DB.answers.length > 4000) DB.answers.splice(0, DB.answers.length-4000);
  save();
}

/* Naming the kind of slip after a missed numeric question. The answer is
   already logged by then, so this writes the kind onto that entry rather than
   logging a second one. */
function setMissKind(q, kind){
  for(let i = DB.answers.length - 1; i >= 0; i--){
    const a = DB.answers[i];
    if(a.qid !== q.id) continue;
    if(a.result !== 'wrong') return false;
    a.missKind = kind; save(); return true;
  }
  return false;
}

/* Marking a correct answer as a guess after the fact. The correct path has
   already advanced the box; this pulls the concept back to unresolved and
   rewrites the logged result, so the answer log and the concept state agree. */
function markGuessed(q){
  const last = DB.answers[DB.answers.length-1];
  const s = st(q.concept);
  if(last && last.qid === q.id && last.result === 'correct'){
    last.result = 'guessed';
    s.guessed++; s.correct = Math.max(0, s.correct - 1); s.streak = 0;
    s.box = 0;
    schedule(s); save();
    return true;
  }
  return false;
}

/** Rank one candidate question. Higher score = ask sooner. */
function score(q){
  const s = DB.concepts[q.concept];
  if(!s) return {tier:3, sub:0};                       // never tested
  const cooled = (DB.qn - s.lastQ) >= GAP;
  if(s.box === 0 && s.seen > 0){                       // missed / unresolved
    if(!cooled) return null;                           // too soon — rule 2
    return {tier:4, sub: s.wrong*10 + s.guessed*5};
  }
  if(isDue(s)) return {tier:2, sub: 6 - s.box};        // due for spaced review
  // Answered correctly and not yet due. Rule 1 says do not repeat it. Only the
  // explicit "Ask everything" setting overrides that, and then oldest-first.
  if((DB.settings.mode||DEFAULT_MODE) !== 'all') return null;
  return {tier:1, sub: -s.lastQ};
}

/**
 * Pick the next question from a pool.
 * Prefers a question on the concept that has NOT been asked before (rule 2/6:
 * re-test the concept with different wording rather than the identical item).
 */
function pickNext(pool, justAsked){
  const cands = [];
  for(const q of pool){
    if(justAsked && q.id === justAsked) continue;
    const sc = score(q);
    if(!sc) continue;
    const s = DB.concepts[q.concept];
    const fresh = !s || !s.asked.includes(q.id);       // unseen wording of this concept
    cands.push({q, tier:sc.tier, sub:sc.sub, fresh:fresh?1:0, r:Math.random()});
  }
  if(!cands.length) return null;
  cands.sort((a,b)=>
      b.tier - a.tier
   || b.fresh - a.fresh
   || b.sub  - a.sub
   || a.r    - b.r);
  // sample from the top of the ranked list so the order is not identical every run
  let top = cands.filter(c => c.tier===cands[0].tier && c.fresh===cands[0].fresh);
  // Rule 5 puts a missed concept ahead of a never-seen one. Taken literally,
  // a pool with many open misses serves them back to back and the never-seen
  // material waits, so the "not yet seen" count in Weak spots stands still
  // while the retests cycle. A missed concept now takes at most every other
  // turn: after one retest the next pick goes to never-seen material when any
  // remains in the pool. The GAP rule still holds for each concept.
  if(cands[0].tier === 4 && LAST_TIER === 4){
    const unseen = cands.filter(c => c.tier === 3);
    if(unseen.length) top = unseen;
  }
  const pick = top[Math.floor(Math.random()*Math.min(top.length,5))];
  LAST_TIER = pick.tier;
  return pick.q;
}
let LAST_TIER = 0;   // tier of the question pickNext served last (4 = a missed concept's retest)

/* ==========================================================================
   HELPERS
   ========================================================================== */
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LETTERS = 'ABCDEFGHIJ';
/* Extra practice lives outside QUESTIONS (no exam draw, no module counts), but
   an answer to one is still looked up by id in the quiz and in Weak spots. */
const byId = id => QUESTIONS.find(q=>q.id===id) || (typeof EXTRAS === 'undefined' ? undefined : EXTRAS.find(q=>q.id===id)) || (typeof TERM_QS === 'undefined' ? undefined : TERM_QS.find(q=>q.id===id));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function conceptsIn(pool){ return [...new Set(pool.map(q=>q.concept))]; }
/** Concepts in a pool that are still waiting: never seen, missed, or due again. */
function remainingIn(pool){
  let n = 0;
  for(const c of conceptsIn(pool)){
    const st = DB.concepts[c];
    if(!st || !st.seen || st.box === 0 || isDue(st)) n++;
  }
  return n;
}
function masteryOf(pool){
  const cs = conceptsIn(pool);
  let m=0, t=0, w=0;
  for(const c of cs){
    const s = DB.concepts[c];
    if(s && s.seen) t++;
    if(s && s.box >= MASTER_BOX) m++;
    else if(s && s.box > 0) w++;     // answered right at the last attempt, not yet mastered
  }
  return {mastered:m, onway:w, touched:t, total:cs.length};
}

/* A professor's colour chip. Generic over COURSE.professors: the first two get
   the two accent colours the stylesheet defines, the rest fall back to neutral.
   Hidden entirely by the filter bar when the course has one professor. */
const PROF_CLASS = {};
COURSE.professors.forEach((p, i) => { PROF_CLASS[p] = ['sik', 'yen'][i] || ''; });
function profTag(p){
  if(!p || COURSE.professors.length < 2) return '';
  return `<span class="tag ${PROF_CLASS[p] || ''}">${esc(p)}</span>`;
}
