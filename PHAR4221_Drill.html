{id:'inf-c1', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'basics', concept:'why-infuse', skill:'recall',
 source:'both',
 stem:'What does administering a drug by continuous intravenous infusion allow that a single intravenous bolus does not?',
 options:[
  {t:'Precise control of the plasma concentration', correct:true,
   why:'A bolus puts the whole dose in at once, so the concentration starts at its highest value and falls from there with nothing holding it up. An infusion adds drug continuously, so the level can be held wherever the infusion rate puts it for as long as the infusion runs. That is why the rate, rather than the size of a single dose, is the quantity chosen when a level has to be maintained.'},
  {t:'Elimination of the drug by a zero-order process', correct:false,
   why:'The zero-order description belongs to what goes in, not to what comes out. Elimination stays first order throughout an infusion, which is exactly why the concentration climbs to a plateau instead of rising without limit. Choosing this attaches the word constant to the wrong side of the model.'},
  {t:'A shorter elimination half-life', correct:false,
   why:'Half-life is set by the rate constant, which belongs to the drug and the patient, and changing the route of administration does not touch it. Only the way the drug is put into the body has changed. A student who picks this is treating half-life as something the dosing schedule can adjust.'},
  {t:'A larger apparent volume of distribution', correct:false,
   why:'Volume of distribution is a proportionality constant between the amount of drug in the body and the measured plasma concentration, and it is a property of how the drug distributes. Infusing rather than injecting does not change where the drug goes. This answer swaps a fixed pharmacokinetic parameter for a dosing decision.'}],
 teach:'An infusion differs from a bolus in one respect only: drug is entering the body continuously rather than all at once. Because input continues while elimination runs, the concentration settles at a level fixed by the infusion rate and the clearance, and that level can be chosen in advance. Control of the plasma concentration is therefore the reason the route is used.',
 cite:'3IntravenousInfusions.pdf, slide "Intravenous Infusion"',
 quote:'Allows for precise control of plasma drug concentration'},

{id:'inf-c2', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'basics', concept:'zero-in-first-out', skill:'tell',
 source:'both',
 stem:'During a continuous intravenous infusion, how are the input and the output of drug described?',
 options:[
  {t:'Zero-order input, first-order output', correct:true,
   why:'The pump delivers a fixed amount of drug per unit time regardless of how much is already in the body, which is the definition of a zero-order process. Elimination is unchanged by the route, so a constant fraction of what is present leaves per unit time, which is first order. The two running together are what produce the rising curve that flattens.'},
  {t:'Zero-order input, zero-order output', correct:false,
   why:'If output were also a fixed amount per unit time, the concentration would either rise or fall forever in a straight line and no plateau could exist. The plateau appears precisely because the amount leaving grows as the concentration grows. Selecting this means carrying the constant-rate description across from the pump to the body.'},
  {t:'First-order input, first-order output', correct:false,
   why:'A first-order input would mean the delivery rate depended on how much drug was already present, which no infusion pump does. The rate set on the pump is the same at the first minute and the last. This answer applies the elimination description to the infusion as well.'},
  {t:'First-order input, zero-order output', correct:false,
   why:'This reverses both halves at once, and it would describe a system whose delivery falls as the body fills while removal stays fixed. Nothing in the infusion model works that way. It usually comes from remembering that two different orders are involved without remembering which belongs where.'}],
 teach:'A constant rate of input is by definition zero order, because the amount entering per unit time does not depend on how much drug is present. Elimination is a property of the drug and the patient, not of the route, so it remains first order. The whole shape of the infusion curve follows from that pairing: input is flat while output grows with the concentration, so the two converge.',
 cite:'3IntravenousInfusions.pdf, slide "Intravenous Infusion"',
 quote:'Our input is zero order, constant in, first order out. When we stop the in, then it’s just out.'},

{id:'inf-c3', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'css', concept:'steady-state-defn', skill:'recall',
 source:'both',
 stem:'Steady state during a continuous intravenous infusion is reached when:',
 options:[
  {t:'The rate of drug in equals the rate of drug out', correct:true,
   why:'The amount in the body rises only while more drug is arriving than leaving. As the concentration climbs, the first-order rate of elimination climbs with it, until removal exactly matches delivery. From that point the amount in the body no longer changes, which is what the plateau on the curve shows.'},
  {t:'The infusion has delivered the whole prescribed dose', correct:false,
   why:'Steady state is a balance of two rates, not a milestone in the total amount delivered. An infusion can be stopped before steady state or run long past it, and the volume of drug given tells you nothing about whether the balance has been struck. This answer reads the plateau as an endpoint of the bag rather than of the kinetics.'},
  {t:'Elimination has stopped', correct:false,
   why:'Elimination is fastest at steady state, not absent, because that is when the concentration is highest. What stops is the net change in the amount in the body, since removal now equals delivery. Reading the flat line as no elimination is the commonest misreading of the plateau.'},
  {t:'The plasma concentration equals the loading dose divided by the rate', correct:false,
   why:'That expression mixes an amount with a rate and does not produce a concentration at all. The steady-state concentration is the infusion rate divided by clearance, and a loading dose changes how quickly the level is reached, not what the level is. Picking this means assembling a formula from the symbols in view rather than from the balance of rates.'}],
 teach:'Steady state is a statement about rates. Drug arrives at a fixed rate and leaves at a rate proportional to what is present, so the amount in the body rises until the two are equal. The plateau concentration is whatever level makes the first-order output match the zero-order input, which is why it is fixed by the infusion rate and the clearance and by nothing else.',
 cite:'3IntravenousInfusions.pdf, slide "Drug Concentration at Steady-State"',
 quote:'Steady-state is achieved when: rate in = rate out'},

{id:'inf-c4', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'css', concept:'time-to-css', skill:'recall',
 source:'both',
 stem:'A drug is given by continuous intravenous infusion with no loading dose. How long does it take to reach steady state?',
 options:[
  {t:'Three to five half-lives', correct:true,
   why:'Each half-life closes half of the remaining gap between the current concentration and the plateau, so three half-lives reach 87.5 per cent of steady state and five reach about 96.9 per cent. That band is close enough that the level is treated as steady. The answer depends only on the half-life, which is why no other parameter appears in it.'},
  {t:'Three to five hours', correct:false,
   why:'Nothing in the model fixes a number of hours, because the approach to the plateau is measured in half-lives and half-lives differ between drugs. A drug with a one-hour half-life is effectively at steady state within five hours and a drug with a twelve-hour half-life is nowhere near. Quoting hours drops the only parameter the answer depends on.'},
  {t:'Three to five times the infusion rate', correct:false,
   why:'The infusion rate is an amount per unit time and multiplying it by a number does not give a time. The rate sets how high the plateau is, not how long it takes to arrive. This confuses the two questions the infusion curve answers.'},
  {t:'It depends on the size of the loading dose', correct:false,
   why:'The stem states that no loading dose is given, and a loading dose in any case fills the body immediately rather than changing how the infusion approaches its plateau. The approach to steady state is governed by the elimination rate constant alone. Selecting this attaches the time course to the dose rather than to the half-life.'}],
 teach:'The fraction of steady state reached after infusing for a time t is one minus e to the minus kt, and writing t as a number of half-lives makes that fraction independent of the drug: one half-life gives 50 per cent, two give 75 per cent, three give 87.5 per cent. Practically the level is called steady after three to five half-lives. Any more precise question, such as the time to 90 or 95 per cent, is a calculation rather than this rule.',
 cite:'3IntravenousInfusions.pdf, slide "Drug Concentration at Steady-State"; 09-02 lecture',
 quote:'if I ask you how long it takes to get steady state following IV infusion, the simplest answer. Is 3 to 5 half-lives'},

{id:'inf-c5', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'css', concept:'rate-vs-time-to-css', skill:'apply',
 source:'both',
 stem:'The infusion rate of a drug is doubled and no loading dose is given. What happens to the steady-state concentration and to the time taken to reach it?',
 options:[
  {t:'The steady-state concentration doubles; the time is unchanged', correct:true,
   why:'The plateau is the infusion rate divided by clearance, and clearance is a constant for the patient, so doubling the numerator doubles the plateau. The approach to that plateau is governed by one minus e to the minus kt, which contains no rate term at all. The curve is therefore lifted upward while reaching its new plateau at the same moment as before.'},
  {t:'Both the steady-state concentration and the time double', correct:false,
   why:'The rate appears only in the height of the plateau, never in the exponential term that describes the climb. Doubling the rate raises the target and also raises the rate of accumulation in exact proportion, so the two changes cancel in the timing. This is the distractor she flagged as an exam item shape.'},
  {t:'The steady-state concentration is unchanged; the time is halved', correct:false,
   why:'This has the two effects the wrong way round. The infusion rate is the one thing that sets the plateau, so the plateau cannot be unaffected by it, and the half-life is the only thing that sets the timing, so the timing cannot respond to the rate. It usually comes from thinking of the infusion as filling a fixed container faster.'},
  {t:'The steady-state concentration doubles; the time halves', correct:false,
   why:'The first half is right and the second is the error. Reaching twice the height in the same time already means the drug is accumulating twice as fast, so there is no further saving in time to be had. Expecting both to improve counts the same effect twice.'}],
 teach:'Two different parts of the infusion equation answer two different questions. The factor R over clearance fixes how high the plateau sits, so it responds to the infusion rate. The factor one minus e to the minus kt fixes how far along the climb the concentration has got, so it responds only to the elimination rate constant and therefore to the half-life. Changing the rate moves the ceiling and leaves the clock alone.',
 cite:'3IntravenousInfusions.pdf, slide "Drug Concentration at Steady-State"; 09-02 and 09-09 lectures',
 quote:'changing the rate changes our steady state concentration … it has no impact, right? Because it is three to five half-lives'},

{id:'inf-c6', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'pre', concept:'fraction-term', skill:'read',
 source:'both',
 stem:'In the equation Cp = (R/Cl)(1 − e^(−kt)) for the plasma concentration during an infusion, what does the term (1 − e^(−kt)) give?',
 options:[
  {t:'The fraction of steady state achieved at time t', correct:true,
   why:'The first factor, R divided by clearance, is the steady-state concentration itself, so whatever multiplies it must be a fraction of that plateau. At t equal to zero the bracket is zero and at long times it approaches one, which matches a concentration starting at nothing and rising to the plateau. Reading the equation as a plateau times a fraction is what makes the half-life table usable.'},
  {t:'The fraction of the dose remaining in the body at time t', correct:false,
   why:'The fraction remaining after a bolus is e to the minus kt, without the one minus in front, and it falls rather than rises. Subtracting it from one turns a decay into an accumulation. This answer imports the bolus expression without noticing that the bracket runs the other way.'},
  {t:'The clearance expressed as a fraction of the infusion rate', correct:false,
   why:'Clearance already appears in the first factor and is a volume per unit time, not a fraction of anything. A dimensionless bracket made of an exponential cannot carry clearance. This comes from trying to attach every symbol in the equation to a named parameter rather than reading the structure.'},
  {t:'The time in half-lives since the infusion began', correct:false,
   why:'The bracket is a pure number between zero and one and can never be a time, whatever value t takes. Time enters inside the exponent, not as the value of the bracket. Confusing the two is what leads to answers with the wrong units.'}],
 teach:'The infusion equation is one product with two independent meanings. R over clearance is the destination, the concentration at which input and output balance. One minus e to the minus kt is the progress toward that destination, a dimensionless fraction fixed entirely by how many half-lives have passed. Every pre-steady-state question is either asking for the destination, for the progress, or for the product of the two.',
 cite:'3IntravenousInfusions.pdf, slide "Drug Concentration Prior to Reaching Steady-State"',
 quote:'The term (1-e-kt) gives the fraction of steady-state concentration achieved after infusing the drug for an amount of time t.'},

{id:'inf-c7', type:'match', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'pre', concept:'halflife-table', skill:'read',
 source:'both',
 stem:'A drug is infused at a constant rate with no loading dose. Match each elapsed number of half-lives to the percentage of the steady-state concentration reached.',
 left:['1 half-life', '2 half-lives', '3 half-lives', '10 half-lives'],
 right:['50%', '75%', '87.5%', '99.9%'],
 pairs:[
  {l:'1 half-life', r:'50%',
   why:'Putting t equal to one half-life into one minus e to the minus kt makes the exponent equal to 0.693, the exponential equal to one half, and the bracket equal to 0.5. Half the gap to the plateau is closed in the first half-life. This is the same 50 per cent that a bolus loses in one half-life, read in the opposite direction.'},
  {l:'2 half-lives', r:'75%',
   why:'After the first half-life half the gap remains, and the second half-life closes half of what is left, leaving a quarter. Three quarters of the plateau has therefore been reached. The pattern is the bolus table run upward rather than downward.'},
  {l:'3 half-lives', r:'87.5%',
   why:'Each half-life halves the remaining shortfall, so after three the shortfall is one eighth and 87.5 per cent of steady state has been achieved. This is the lower end of the three to five half-life rule for practical steady state.'},
  {l:'10 half-lives', r:'99.9%',
   why:'Ten halvings leave about one thousandth of the gap, so the concentration is 99.9 per cent of the plateau. It is the same 10 half-lives that give 99.9 per cent elimination after a bolus, which is why the two tables are mirror images.'}],
 teach:'The approach to steady state and the decay after a bolus are the same exponential seen from two sides. In both cases each half-life halves what is left to happen: half the dose still to be eliminated, or half the gap still to be closed. Because the bracket contains only k and t, the percentages are the same for every drug once time is counted in half-lives.',
 cite:'3IntravenousInfusions.pdf, slide "Drug Concentration Prior to Reaching Steady-State"; 09-02 lecture',
 quote:'one half-life. Gets us maybe 50% of the steady-state concentration',
 note:'The captions record the four-half-life figure as "93.25" in the 09-02 lecture and "93" in the 09-09 review; one minus one sixteenth is 93.75 per cent. The four-half-life row is left out of this question for that reason.'},

{id:'inf-c8', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'css', concept:'time-to-css', skill:'recall', dupOf:'inf-c4',
 source:'transcript',
 stem:'Why is the plasma concentration during a continuous infusion described as never actually reaching steady state?',
 options:[
  {t:'The curve is asymptotic, so it only approaches the plateau', correct:true,
   why:'The fraction of steady state achieved is one minus e to the minus kt, and an exponential never reaches zero, so the bracket never reaches exactly one. Each half-life closes half of the remaining gap, leaving a smaller gap rather than none. At ten half-lives the shortfall is about one part in a thousand, which is why the level is treated as steady well before then.'},
  {t:'Elimination speeds up as the concentration rises, so the level falls back', correct:false,
   why:'Elimination does speed up as the concentration rises, but only until it matches the input, at which point the level stops rising rather than falling back. Nothing pushes the concentration down while the infusion continues. This answer turns the approach to balance into an overshoot that the model does not contain.'},
  {t:'The infusion pump cannot hold a truly constant rate', correct:false,
   why:'The statement is about the mathematics of the model, not about the equipment, and the model assumes a perfectly constant input. Even with an exactly constant rate the plateau is approached rather than attained. Reaching for a practical explanation here misses what the exponential is doing.'},
  {t:'The volume of distribution keeps increasing during the infusion', correct:false,
   why:'Volume of distribution is a constant for the drug in the patient and does not change because drug is arriving continuously. If it did change, the plateau itself would move rather than being approached. This answer makes a fixed parameter carry the behaviour of the exponential term.'}],
 teach:'Approaching a plateau exponentially means closing a fixed fraction of the remaining gap in each equal interval of time. The gap therefore shrinks without ever closing, which is what asymptotic means. The practical consequence is that steady state is defined by how close is close enough, which is why three to five half-lives is the working answer and ten half-lives gives 99.9 per cent.',
 cite:'09-02 lecture (transcript)',
 quote:'remember, this is an asymptotic curve, so we’re never actually going to reach steady state, we’re gonna get close. So, 10 gets us 99.9, 11 gets us 99.99'},

{id:'inf-c9', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'stop', concept:'post-cessation-model', skill:'recall',
 source:'both',
 stem:'A continuous infusion is stopped. Which equation describes the plasma concentration from that moment on, and what does its starting value represent?',
 options:[
  {t:'Cp = Cpeak·e^(−kt), with Cpeak the concentration at cessation', correct:true,
   why:'Once the infusion stops there is no input, so the only process left is first-order elimination, which is the same decay seen after a bolus. The concentration at the moment of cessation therefore plays the part of the initial concentration in that decay, and t is counted from cessation rather than from the start of the infusion. Getting the peak value right is the whole of the work, since the decay itself is routine.'},
  {t:'Cp = (R/Cl)(1 − e^(−kt)), continued past the end of the infusion', correct:false,
   why:'That equation contains the infusion rate, which is now zero, so it cannot describe a period with no drug going in. It also rises toward a plateau, whereas the concentration after cessation falls. Continuing to use it means not noticing that the input term has been switched off.'},
  {t:'Cp = Css·e^(−kt) in every case', correct:false,
   why:'This is right only when the infusion ran long enough to reach steady state, because only then is the concentration at cessation equal to Css. An infusion stopped after one or two half-lives peaks well below the plateau, and using Css would overstate every later concentration. The distinction between decaying from Css and decaying from an end-of-infusion value is one she sets deliberately.'},
  {t:'Cp = Cpeak + R/Cl, evaluated at the time of interest', correct:false,
   why:'Adding a steady-state concentration to the peak produces a value larger than either and one that does not change with time. Nothing is being added to the body after cessation, so no sum can be correct. This comes from carrying the superposition idea used with a loading dose into a situation where only one process is running.'}],
 teach:'Stopping an infusion removes the zero-order input and leaves the first-order output untouched, so the curve from that point is an ordinary first-order decay. The only thing the infusion contributes is the starting height. Every post-cessation problem therefore splits into two steps: find the concentration at the moment the infusion stopped, then decay it for the stated time.',
 cite:'3IntravenousInfusions.pdf, slide "Drug Concentration after an IV Infusion has Ended"',
 quote:'Think of that C peak as your C0 as your starting point.'},

{id:'inf-c10', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'stop', concept:'peak-vs-css', skill:'tell',
 source:'both',
 stem:'Two patients receive the same drug at the same infusion rate. One infusion runs to steady state and the other is stopped after two half-lives. In calculating the concentration some hours after each infusion ends, how do the two differ?',
 options:[
  {t:'The second decays from 75% of the plateau', correct:true,
   why:'Two half-lives of infusion close three quarters of the gap to the plateau, so the concentration at cessation is 0.75 times Css rather than Css itself. That value is the starting point for the decay, and everything after it is identical between the two patients. The difference is entirely in the height the decay begins from.'},
  {t:'The second decays with a larger rate constant', correct:false,
   why:'The elimination rate constant belongs to the drug in the patient and does not depend on how long the infusion ran. Both curves fall at the same fractional rate once the infusion stops. Selecting this attributes a difference in starting height to a difference in slope.'},
  {t:'The second has a lower steady-state concentration', correct:false,
   why:'Steady-state concentration is the infusion rate divided by clearance, and both patients have the same rate and the same drug, so both have the same Css. The second patient simply never got there. Confusing the plateau a regimen would reach with the level it actually reached is the specific error here.'},
  {t:'There is no difference, because both decay from Css', correct:false,
   why:'Only an infusion run to steady state peaks at Css, and two half-lives leaves the concentration a quarter of the way short. Treating every post-infusion decay as starting from the plateau overestimates the second patient at every later time. This is the contrast she builds into consecutive parts of the same problem.'}],
 teach:'After cessation both patients follow the same first-order decay, so the only quantity that can differ is where the decay starts. An infusion carried to steady state starts its decay at Css; an infusion stopped earlier starts it at the pre-steady-state value, which is Css multiplied by one minus e to the minus kt for the duration that was actually infused. Identifying which of the two applies is the first decision in any post-cessation question.',
 cite:'IV-Infusions-Practice-3---Solutions.pdf, parts f and g; 3IntravenousInfusions.pdf, slide "Drug Concentration after an IV Infusion has Ended"',
 quote:'Css or not Css'},

{id:'inf-c11', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'load', concept:'loading-purpose', skill:'recall',
 source:'both',
 stem:'What is the purpose of giving an intravenous loading dose at the start of a continuous infusion?',
 options:[
  {t:'To reach the target steady-state concentration almost immediately', correct:true,
   why:'Without a loading dose the concentration has to climb over three to five half-lives, which is unacceptable for a drug that is needed now. A bolus that puts into the body the amount that would be there at steady state achieves that level at once, and the infusion then holds it. The loading dose buys time, not height.'},
  {t:'To raise the steady-state concentration above what the infusion alone would give', correct:false,
   why:'Steady state is set by the infusion rate and the clearance, and a bolus given once cannot change either of them. Whatever the loading dose, the drug settles at the same plateau, because the bolus is eliminated on the same first-order terms as the infused drug and adds nothing to the rate coming in. Choosing this answer treats the loading dose as extra drug that stays, when what it buys is only the time that would otherwise be spent climbing to the plateau.'},
  {t:'To shorten the elimination half-life so that steady state arrives sooner', correct:false,
   why:'Half-life is a property of the drug and the patient and no dose changes it. The loading dose does not make the approach to the plateau faster; it starts the patient at the plateau so that no approach is needed. Confusing those two is the reason this option is tempting.'},
  {t:'To allow a lower infusion rate to be used for the same effect', correct:false,
   why:'The maintenance rate is fixed by the target concentration and the clearance, and lowering it would simply let the level fall away from the target once the loading dose is eliminated. The bolus and the infusion do different jobs and cannot substitute for one another. Picking this treats the total drug given as the quantity that matters rather than the rate.'}],
 teach:'A loading dose and an infusion rate answer two separate questions. The rate answers where the concentration settles, because the plateau is the rate divided by clearance. The loading dose answers how soon it gets there, by putting the steady-state amount into the body at once. An appropriate loading dose is therefore the amount of drug that would be in the body at steady state, which is Css multiplied by the volume of distribution.',
 cite:'3IntravenousInfusions.pdf, slide "IV Bolus Loading Dose and Continuous IV Infusion"',
 quote:'We want the loading dose to look like the amount of drug that’s in the body at steady state.'},

{id:'inf-c12', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04', multi:true,
 topic:'infusion', sub:'load', concept:'loading-dose-properties', skill:'apply',
 source:'both',
 stem:'A loading dose is given at the same time as a continuous infusion is started. Select every statement that is true. Select all that apply.',
 options:[
  {t:'An appropriate loading dose can be calculated as R divided by k', correct:true,
   why:'Dividing the infusion rate by the elimination rate constant gives the amount of drug that the infusion would eventually hold in the body at steady state. This is the route printed on the slide, and it works provided the infusion rate itself has been chosen to hit the intended concentration. If the rate was picked arbitrarily the resulting loading dose matches that arbitrary plateau rather than the target.'},
  {t:'An appropriate loading dose can be calculated as Css multiplied by the volume of distribution', correct:true,
   why:'Volume of distribution relates the amount in the body to the plasma concentration, so multiplying the target concentration by it gives the amount that must be in the body to produce that concentration. This route starts from the desired concentration rather than from the chosen rate. Where both are available she shows both, and they agree when the rate matches the target.'},
  {t:'The steady-state concentration is unchanged by the loading dose', correct:true,
   why:'The plateau is the infusion rate divided by clearance, and a single bolus alters neither. The loading dose changes only the early part of the curve, and the bolus component decays away as the infusion component builds. She makes this the whole point of asking for the steady-state concentration twice with different loading doses.'},
  {t:'The loading dose shortens the time needed to reach steady state', correct:false,
   why:'The approach to the plateau is governed by one minus e to the minus kt, which contains no dose term, so the infusion component takes just as long as it ever did. What the loading dose does is hold the total concentration at the target while that component builds, so the patient is at the right level from the start. The time course of the infusion itself is untouched.'},
  {t:'The loading dose must be recalculated whenever the half-life changes', correct:false,
   why:'The loading dose is the amount needed to fill the volume of distribution to the target concentration, so it depends on Css and the volume of distribution, not on how fast the drug is cleared. Her renal failure example makes this explicit: the clearance falls, the maintenance rate falls with it, and the loading dose stays the same because the volume of distribution is unchanged. Choosing this treats every parameter as connected to every other.'}],
 teach:'The loading dose fills the body to the target concentration and the infusion replaces what is eliminated. That split explains each of its properties: it is computed from Css and volume of distribution, or equivalently from R and k when the rate already matches the target; it does not alter the plateau, which belongs to rate and clearance; and it survives a change in clearance unchanged, because filling the volume is a separate job from keeping it full.',
 cite:'3IntravenousInfusions.pdf, slide "IV Bolus Loading Dose and Continuous IV Infusion"; IV-Infusions-Practice-4-Solutions.pdf part g',
 quote:'another way to think about this loading dose. Concentration of drug in the body at steady-state times the volume and distribution'},

{id:'inf-c13', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'load', concept:'loading-dose-mismatch', skill:'apply',
 source:'transcript',
 stem:'A drug is infused at a rate that gives a steady-state concentration of 24 mg/L, and the loading dose given with it is larger than the amount of drug the body holds at steady state. What does the concentration-time curve look like?',
 options:[
  {t:'It starts above 24 mg/L and falls toward it', correct:true,
   why:'The measured concentration is the sum of the decaying bolus curve and the rising infusion curve. Too much drug given at once makes that sum exceed the plateau early on, and as the bolus component decays faster than the infusion component builds, the total settles down onto the plateau. With her 288 mg loading dose the two-hour concentration is 24 mg/L; raising it to 388 mg puts the two-hour concentration near 30 mg/L, above the plateau.'},
  {t:'It starts below 24 mg/L and climbs to it', correct:false,
   why:'That is the picture for a loading dose that is too small, where the bolus does not fill the volume of distribution to the target and the infusion has to make up the difference. Starting low is what a loading dose is given to avoid. Selecting this reverses the direction of the mismatch.'},
  {t:'It rises steadily to a plateau above 24 mg/L', correct:false,
   why:'The plateau is the infusion rate divided by clearance and a bolus cannot move it, so no loading dose produces a higher final level. The excess from an oversized bolus is eliminated like any other drug. This answer lets the loading dose set the steady-state concentration.'},
  {t:'It stays flat at 24 mg/L from the first minute', correct:false,
   why:'That is what an appropriate loading dose achieves, and the stem states this one is larger than the steady-state amount. A flat line is the sum of a decaying and a rising curve only when the bolus exactly fills the volume of distribution to Css. Choosing this ignores the condition set in the stem.'}],
 teach:'With a loading dose running alongside an infusion the concentration at any moment is the sum of two curves: a bolus decaying from the loading dose divided by the volume of distribution, and an infusion climbing toward Css. When the loading dose equals Css times the volume of distribution the two sum to a flat line at Css. Too much drug makes the early sum overshoot and fall back; too little makes it start low and climb.',
 cite:'09-02 lecture (transcript); 3IntravenousInfusions.pdf, slide "IV Bolus Loading Dose and Continuous IV Infusion"',
 quote:'the loading dose helps us to reach that steady state concentration, like almost immediately. But you got to choose wisely on the loading dose',
 note:'The slide carries only a graph of the too-high and too-low cases with no printed caption, so the described behaviour is taken from the 09-02 transcript, where she recomputes her 288 mg example with 388 mg and gets about 30 mg/L at two hours against a plateau of 24 mg/L.'},

{id:'inf-c14', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'basics', concept:'units-of-R', skill:'recall',
 source:'transcript',
 stem:'What are the units of the infusion rate R?',
 options:[
  {t:'Amount per unit time, such as mg/hr', correct:true,
   why:'R is a zero-order input, and a zero-order rate constant is always an amount or a concentration per unit time. In infusion problems the quantity being delivered is an amount of drug, so milligrams per hour is the usual form. Dividing that by a clearance in litres per hour leaves milligrams per litre, which is the concentration the equations return.'},
  {t:'Reciprocal time, such as hr⁻¹', correct:false,
   why:'Reciprocal time belongs to a first-order rate constant, where the rate is a proportion of what is present rather than a fixed quantity. R is fixed by the pump and does not refer to the amount in the body at all. Selecting this carries the elimination constant’s units onto the input.'},
  {t:'Volume per unit time, such as L/hr', correct:false,
   why:'Volume per unit time is clearance, which appears in the same equation and is easy to swap with R for that reason. Clearance describes how much plasma is stripped of drug per hour; R describes how many milligrams arrive per hour. Mixing them makes Css come out with no units at all.'},
  {t:'Amount per unit volume, such as mg/L', correct:false,
   why:'That is a concentration, which is what the equations produce rather than what is put into them. An infusion rate with no time in its units could not describe a continuous input. This usually comes from reading the units off the answer rather than off the quantity.'}],
 teach:'Units are the fastest check on an infusion calculation. R is an amount per time, clearance is a volume per time, and their quotient is an amount per volume, which is the steady-state concentration. If a calculated Css does not come out in mg/L, the wrong quantity has been used in one of the two positions.',
 cite:'09-02 lecture (transcript)',
 quote:'what I want you to know about this one, this are. The units of r. Are going to be a mount. Per time. So most often milligrams per hour.'},

{id:'inf-c15', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'basics', concept:'infusion-curve-shape', skill:'read',
 source:'both',
 stem:'On linear axes, how does a plasma concentration-time curve for a continuous infusion with no loading dose differ from one for an intravenous bolus?',
 options:[
  {t:'It starts at zero and rises to a plateau', correct:true,
   why:'At the moment an infusion begins no drug has yet been delivered, so the concentration starts at zero and climbs as drug accumulates faster than it is removed. The climb flattens as the first-order output grows to meet the fixed input. A bolus puts the entire dose in instantly, so its highest concentration is its first one.'},
  {t:'It starts high and falls more slowly than a bolus curve', correct:false,
   why:'Nothing is in the body when the infusion starts, so there is no high starting point to fall from. The rate of elimination is the same for the same drug in the same patient either way. This answer keeps the bolus shape and adjusts only its steepness.'},
  {t:'It is a straight line on linear axes for the whole infusion', correct:false,
   why:'A straight rise would mean nothing was being eliminated, but first-order elimination begins as soon as drug is present and grows with the concentration. That growing removal is what bends the curve over into a plateau. Straight-line thinking here comes from applying the zero-order input to the whole system.'},
  {t:'It reaches its maximum concentration sooner than a bolus does', correct:false,
   why:'A bolus reaches its maximum at time zero, which cannot be beaten. An infusion approaches its maximum over three to five half-lives, and strictly never attains it. Reversing this is what a loading dose is given to correct.'}],
 teach:'The shape of the curve follows directly from when the drug arrives. All at once gives an immediate peak followed by first-order decay. Continuously gives a rise from zero that flattens as elimination catches up with input. Sketching the right one before starting a calculation identifies which equation applies.',
 cite:'3IntravenousInfusions.pdf, slide "Intravenous Infusion"; 09-02 lecture',
 quote:'IV infusion, we’re starting low and we’re building.'},

{id:'inf-c16', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04', lowYield:true,
 topic:'infusion', sub:'basics', concept:'bolus-dose-dependence', skill:'apply',
 source:'slide',
 stem:'Which of the following would you expect to increase with an increase in an intravenous bolus dose?',
 options:[
  {t:'Plasma drug concentration', correct:true,
   why:'Concentration is the amount of drug in the body divided by the volume of distribution, so a larger dose produces a proportionally larger concentration in a fixed volume. This is the only quantity among the four that the size of the dose can move. Doubling the dose doubles the initial concentration and leaves the shape of the curve unchanged.'},
  {t:'Clearance', correct:false,
   why:'Clearance is the elimination rate constant multiplied by the volume of distribution, and both are constants for the drug in the patient, so their product is constant too. A larger dose means more drug is removed per hour, but the volume of plasma cleared per hour is the same. Confusing the rate of elimination with clearance is what makes this option look right.'},
  {t:'Elimination half-life', correct:false,
   why:'Half-life is 0.693 divided by the elimination rate constant, and neither term contains the dose. The time to lose half of what is present is the same whether the starting point is high or low, which is the defining property of a first-order process. Expecting more drug to take proportionally longer describes zero-order elimination instead.'},
  {t:'Apparent volume of distribution', correct:false,
   why:'Volume of distribution is a proportionality constant describing how the drug distributes between plasma and the rest of the body, and it is a property of the drug rather than of the dose. Giving more drug fills the same apparent volume to a higher concentration. Treating it as a container that stretches with the dose is the underlying error.'}],
 teach:'For a linear first-order system the dose scales the concentrations and touches nothing else. Volume of distribution, elimination rate constant, half-life and clearance are all constants of the drug in that patient, so they are unchanged by how much is given. Only quantities that are amounts or concentrations respond to the dose.',
 cite:'3IntravenousInfusions.pdf, opening poll slide',
 quote:'Which of the following would you expect to increase with an increase in IV bolus dose?'},

{id:'inf-n1', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'css', concept:'css-from-rate', skill:'infusion',
 source:'both',
 stem:'Theophylline is given by continuous intravenous infusion at 50 mg/hr. Its half-life is 6 hours and its volume of distribution is 30 L. What steady-state plasma concentration is expected?',
 units:'mg/L',
 answer:14.43,
 tol:0.2,
 steps:[
  {k:'setup', t:'Css = R / Cl, and clearance is itself k · VD, so the half-life has to become a rate constant before the plateau can be computed',
   why:'At steady state the rate going in equals the rate coming out, and the rate coming out is clearance multiplied by concentration, so the plateau is the infusion rate divided by clearance. The stem gives a half-life and a volume rather than a clearance, so naming the relation first is what shows which two conversions have to happen before the division.'},
  {k:'algebra', t:'k = 0.693 / 6 hr = 0.1155 hr⁻¹',
   why:'The steady-state concentration needs a clearance, and clearance is the elimination rate constant multiplied by the volume of distribution, so the half-life has to be converted to a rate constant first. Dividing 0.693 by a time in hours leaves reciprocal hours, which is what a first-order rate constant must be.'},
  {k:'algebra', t:'Cl = k · VD = (0.1155 hr⁻¹)(30 L) = 3.465 L/hr',
   why:'Clearance is the volume of plasma cleared of drug per unit time, and it is the product of the fractional rate of removal and the volume that drug occupies. Reciprocal hours multiplied by litres leaves litres per hour, the unit a clearance must carry.'},
  {k:'algebra', t:'Css = R / Cl = (50 mg/hr) / (3.465 L/hr) = 14.43 mg/L',
   why:'At steady state the rate in equals the rate out, and the rate out is clearance multiplied by concentration, so the concentration is the infusion rate divided by clearance. Milligrams per hour divided by litres per hour cancels the hours and leaves milligrams per litre.'},
  {k:'round', t:'Css = 14.43 mg/L',
   why:'Her worked value on the slide is 14.43 mg/L, carried to two decimal places, and the transcript records it aloud as about 14. The two decimal places follow the four-figure rate constant she uses throughout.'}],
 teach:'Steady state is the concentration at which first-order removal matches the fixed input, so Css is R divided by clearance. When clearance is not given directly it is built from the half-life and the volume of distribution, since clearance equals k times VD and k equals 0.693 over the half-life. The whole calculation is one division once those two constants are assembled.',
 cite:'3IntravenousInfusions.pdf, slide "Example 1"',
 quote:'What is the expected steady-state concentration of theophylline in a patient?'},

{id:'inf-n2', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'rate', concept:'rate-for-target-css', skill:'infusion',
 source:'both',
 stem:'The same drug has a half-life of 6 hours and a volume of distribution of 30 L. What infusion rate would achieve a steady-state concentration of 20 mg/L?',
 units:'mg/hr',
 answer:69.3,
 tol:1.0,
 steps:[
  {k:'setup', t:'R = Css · Cl = Css · k · VD',
   why:'Rearranging Css equal to R over clearance puts the rate on its own, so the wanted concentration is multiplied rather than divided by clearance. Writing clearance as k times VD lets the two parameters given in the stem be used directly.'},
  {k:'algebra', t:'k = 0.693 / 6 hr = 0.1155 hr⁻¹',
   why:'The relation between rate and steady-state concentration runs through clearance, and clearance needs the rate constant. Converting the half-life first keeps every later line in reciprocal hours.'},
  {k:'algebra', t:'R = (20 mg/L)(0.1155 hr⁻¹)(30 L) = 69.3 mg/hr',
   why:'Milligrams per litre multiplied by reciprocal hours multiplied by litres cancels the litres and leaves milligrams per hour, which is the unit an infusion rate must have. The arithmetic is 20 times 3.465.'},
  {k:'round', t:'R = 69.3 mg/hr',
   why:'Her slide prints 69.3 mg/hr and the transcript records the same figure aloud. One decimal place is what her four-figure rate constant supports.'}],
 teach:'Choosing an infusion rate is the steady-state relation read backwards. The target concentration multiplied by clearance gives the amount that must be delivered each hour to replace exactly what is removed each hour. Because clearance is a constant for that patient, the rate and the plateau are strictly proportional, so doubling the target doubles the rate.',
 cite:'3IntravenousInfusions.pdf, slide "Example 2"',
 quote:'How would we alter the infusion rate to achieve a steady-state concentration of 20 mg/L?'},

{id:'inf-n3', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'pre', concept:'cp-before-steady-state', skill:'conctime',
 source:'slide',
 stem:'An infusion of 50 mg/hr is started in a patient whose total body clearance is 4.5 L/hr and whose elimination rate constant is 0.15 hr⁻¹. What is the plasma concentration 8 hours after the infusion is started?',
 units:'mg/L',
 answer:7.76,
 tol:0.15,
 steps:[
  {k:'setup', t:'Cp = (R / Cl)(1 − e^(−kt))',
   why:'The infusion has been running for a stated time rather than to steady state, so the plateau has to be scaled by the fraction of steady state achieved. The first factor is the destination and the bracket is the progress toward it.'},
  {k:'algebra', t:'R / Cl = (50 mg/hr) / (4.5 L/hr) = 11.11 mg/L',
   why:'This is the steady-state concentration the infusion is heading for, obtained by dividing the input rate by the clearance. Milligrams per hour over litres per hour leaves milligrams per litre.'},
  {k:'algebra', t:'1 − e^(−(0.15 hr⁻¹)(8 hr)) = 1 − e^(−1.2) = 0.6988',
   why:'Reciprocal hours multiplied by hours gives a dimensionless exponent, which is what an exponential requires. The bracket is a pure fraction, and 0.6988 says the concentration is about 70 per cent of the way to its plateau after 8 hours.'},
  {k:'algebra', t:'Cp = (11.11 mg/L)(0.6988) = 7.7645 mg/L',
   why:'Multiplying the plateau by the fraction achieved gives the concentration at 8 hours, in milligrams per litre because the bracket carries no units. The answer must fall below the 11.11 mg/L plateau, and it does, which is the quickest check that the bracket was applied the right way round.'},
  {k:'round', t:'Cp = 7.76 mg/L',
   why:'Two decimal places matches the precision of the parameters she supplies in this problem. The concentration is about 70 per cent of the plateau, which is what eight hours at a rate constant of 0.15 per hour should deliver for an infusion started with no loading dose.'}],
 teach:'A concentration asked for at a stated time during an infusion is always the product of two separate quantities: where the curve is going and how far along it is. The destination needs only R and clearance; the progress needs only k and t. Computing them separately makes the arithmetic self-checking, because the fraction must lie between zero and one.',
 cite:'3IntravenousInfusions.pdf, slide "Example 3"',
 quote:'Calculate the Cp 8 hrs after an infusion of 50 mg/hr has been started.',
 note:'The slide poses this example and her working records only the fraction, 0.698; no final concentration is printed on the slide or spoken in the 09-02 captions. The 7.76 mg/L keyed here is computed from her own stated values of R, ClT and k.'},

{id:'inf-n4', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'time', concept:'time-to-percent-css', skill:'infusion',
 source:'both',
 stem:'A drug with an elimination rate constant of 0.15 hr⁻¹ is infused at a constant rate with no loading dose. How long must the infusion continue to reach 90% of the steady-state concentration?',
 units:'hr',
 answer:15.35,
 tol:0.3,
 steps:[
  {k:'setup', t:'0.9 = 1 − e^(−kt)',
   why:'The fraction of steady state achieved is the bracket in the infusion equation, so reaching 90 per cent means setting that bracket equal to 0.9. The infusion rate and the clearance cancel out because both sides are fractions of the same plateau, which is why no rate appears anywhere in this calculation.'},
  {k:'algebra', t:'e^(−kt) = 1 − 0.9 = 0.1',
   why:'Subtracting 0.9 from both sides isolates the exponential. The 0.1 is the fraction of the gap still to be closed, which is the quantity the logarithm will act on.'},
  {k:'algebra', t:'t = −ln(0.1) / k = 2.3026 / 0.15 hr⁻¹ = 15.35 hr',
   why:'Taking natural logarithms of both sides brings the exponent down, and dividing by the rate constant isolates t. Dividing a pure number by a quantity in reciprocal hours leaves hours, which is the unit a time must have.'},
  {k:'round', t:'t = 15.35 hr',
   why:'Her working prints 15.35 hr and the transcript records the answer aloud as 15 hours. Two decimal places follows the precision of the printed rate constant.'}],
 teach:'Any question that names a percentage of steady state is solved from the bracket alone, because the plateau cancels. Setting one minus e to the minus kt equal to the target fraction, isolating the exponential and taking logarithms gives the time in one line. Where the percentage is a clean power of one half the same answer can be counted off in half-lives instead.',
 cite:'3IntravenousInfusions.pdf, slide "Example 4"',
 quote:'How long will the infusion have to be continued to achieve 90% steady-state?'},

{id:'inf-n5', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'stop', concept:'post-cessation-decay', skill:'conctime',
 source:'slide',
 stem:'A continuous intravenous infusion of a drug with a half-life of 5 hours yielded a steady-state concentration of 15 mg/L. What plasma concentration is expected 12 hours after the infusion is stopped?',
 units:'mg/L',
 answer:2.84,
 tol:0.1,
 steps:[
  {k:'setup', t:'Cp = Cpeak·e^(−kt), with Cpeak = Css = 15 mg/L',
   why:'The infusion ran to steady state, so the concentration at the moment of cessation is the steady-state concentration itself. With no drug going in, the only remaining process is first-order elimination, and the peak takes the place of the initial concentration.'},
  {k:'algebra', t:'k = 0.693 / 5 hr = 0.1386 hr⁻¹',
   why:'The decay is written in terms of the rate constant, so the stated half-life must be converted. Dividing 0.693 by hours leaves reciprocal hours.'},
  {k:'algebra', t:'Cp = (15 mg/L)e^(−(0.1386 hr⁻¹)(12 hr)) = (15 mg/L)e^(−1.6632)',
   why:'Time is counted from the moment the infusion stopped, not from when it began, because the decay starts there. Reciprocal hours multiplied by hours gives a dimensionless exponent and the concentration keeps its own units.'},
  {k:'round', t:'Cp = 2.84 mg/L',
   why:'The exponential evaluates to 0.1895, and 15 multiplied by that is 2.8430 mg/L. Two decimal places matches the precision she reports concentrations to in this module.'}],
 teach:'Once an infusion stops the curve is an ordinary first-order decay, so the only decision is what the starting concentration is. An infusion carried to steady state starts its decay at Css. Where the elapsed time happens to be a whole number of half-lives the same answer can be got by halving repeatedly, which is why she prefers to reshape the time into half-lives when she can.',
 cite:'3IntravenousInfusions.pdf, slide "Example 5"',
 quote:'What is the expected plasma concentration 12 hours following the cessation of a continuous intravenous infusion of a medicinal agent (half-life = 5 hr) that yielded a steady-state concentration of 15 mg/L?',
 note:'The slide asks for 12 hours. In the 09-02 lecture she changed the time to 10 hours to make it exactly two half-lives, and then took 0.25 of 15 mg/L, giving 3.75 mg/L; her slide annotation shows the same 0.25 route. The keyed 2.84 mg/L is the 12-hour value the slide actually asks for, and 3.75 mg/L is the answer to the 10-hour version she substituted in class.'},

{id:'inf-n6', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'pre', concept:'cp-before-steady-state', skill:'conctime', dupOf:'inf-n3',
 source:'both',
 stem:'A patient received an intravenous infusion of 150 mg over a period of 6 hours. The drug has an elimination rate constant of 0.231 hr⁻¹ and an apparent volume of distribution of 15 L. What is the plasma concentration at the end of the infusion?',
 units:'mg/L',
 answer:5.41,
 tol:0.12,
 steps:[
  {k:'setup', t:'Cp = (R / Cl)(1 − e^(−kt)) at the end of the infusion, so a rate and a clearance both have to be assembled from what the stem gives',
   why:'The infusion stops after a stated time rather than running to steady state, so the plateau has to be scaled by the fraction of the way there. Neither the rate nor the clearance is given directly: the stem supplies a total dose with a duration, and a rate constant with a volume. Naming the relation first fixes what has to be built before the bracket can be applied.'},
  {k:'algebra', t:'R = 150 mg / 6 hr = 25 mg/hr',
   why:'The stem gives a total amount and a duration rather than a rate, so the rate has to be formed first. Milligrams divided by hours gives milligrams per hour, which is the unit R must carry.'},
  {k:'algebra', t:'Cl = k · VD = (0.231 hr⁻¹)(15 L) = 3.465 L/hr',
   why:'Clearance is needed for the plateau and is the product of the rate constant and the volume of distribution, both of which are given. Reciprocal hours multiplied by litres leaves litres per hour.'},
  {k:'algebra', t:'Css = R / Cl = (25 mg/hr) / (3.465 L/hr) = 7.215 mg/L',
   why:'This is the concentration the infusion would reach if it ran indefinitely, and it is the height the 6-hour value is a fraction of. The hours cancel and milligrams per litre remain.'},
  {k:'algebra', t:'1 − e^(−(0.231 hr⁻¹)(6 hr)) = 1 − e^(−1.386) = 0.7499',
   why:'Six hours at a rate constant of 0.231 per hour is exactly two half-lives, since 0.693 divided by 0.231 is 3 hours. Two half-lives close three quarters of the gap, which is why the bracket comes out at 0.7499.'},
  {k:'algebra', t:'Cp at 6 hr = (7.215 mg/L)(0.7499) = 5.4107 mg/L',
   why:'Multiplying the plateau by the fraction achieved gives the concentration at the moment the infusion stops. Because six hours is exactly two half-lives here, the answer should be three quarters of 7.215, and 5.41 is exactly that, which is the arithmetic check worth making.'},
  {k:'round', t:'Cp at 6 hr = 5.41 mg/L',
   why:'Two decimal places is the precision she carries concentrations to in this module. Her cross-check in the lecture uses this same 5.41 mg/L as the starting point for the post-infusion decay, so rounding here is what the next question in the set inherits.'}],
 teach:'An infusion stated as a total amount over a period is first converted to a rate, after which it is an ordinary pre-steady-state problem. Recognising that the stated duration is a whole number of half-lives turns the exponential into a table lookup: two half-lives is always 75 per cent of steady state, whatever the drug. The end-of-infusion concentration found here is what any later post-cessation question decays from.',
 cite:'3IntravenousInfusions.pdf, slide "Example 6"',
 quote:'A patient received an intravenous infusion of 150 mg over a period of 6 hours.'},

{id:'inf-n7', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'stop', concept:'post-cessation-decay', skill:'conctime', dupOf:'inf-n5',
 source:'both',
 stem:'A patient received an intravenous infusion of 150 mg over a period of 6 hours. The drug has an elimination rate constant of 0.231 hr⁻¹ and an apparent volume of distribution of 15 L. What is the concentration of the drug in the body 3 hours after cessation of the infusion?',
 units:'mg/L',
 answer:2.71,
 tol:0.08,
 steps:[
  {k:'setup', t:'Two stages: build the concentration at the end of the 6-hour infusion, then decay it for 3 hours with Cp = Cpeak·e^(−kt)',
   why:'The question asks for a concentration after the infusion has stopped, so nothing can be read off a plateau and the problem splits in two. The first stage needs a rate and a clearance to find where the curve had risen to; the second treats that height as the starting concentration of an ordinary first-order decay. Stating both stages first is what keeps the 3 hours counted from cessation rather than from the start.'},
  {k:'algebra', t:'R = 150 mg / 6 hr = 25 mg/hr; Cl = (0.231 hr⁻¹)(15 L) = 3.465 L/hr',
   why:'The rate comes from the amount and the duration, and the clearance from the rate constant and the volume of distribution. Both are needed before the concentration at the end of the infusion can be found.'},
  {k:'algebra', t:'Cpeak = (25 mg/hr / 3.465 L/hr)(1 − e^(−(0.231)(6))) = (7.215 mg/L)(0.7499) = 5.41 mg/L',
   why:'The infusion ran for only two half-lives, so it reached 75 per cent of its plateau rather than the plateau itself. This is the concentration at the moment the infusion stops, and it is what the decay starts from.'},
  {k:'setup', t:'Cp = Cpeak·e^(−kt), t measured from cessation',
   why:'With the input switched off only first-order elimination remains, so the post-infusion curve is the same decay used after a bolus. The 3 hours is counted from the end of the infusion, not from its start.'},
  {k:'algebra', t:'Cp = (5.41 mg/L)e^(−(0.231 hr⁻¹)(3 hr)) = (5.41 mg/L)(0.5) = 2.7058 mg/L',
   why:'Three hours is exactly one half-life for this drug, since 0.693 divided by 0.231 is 3, so the concentration halves and the exponential factor is 0.5. That is the cross-check she uses in the lecture, and it avoids the calculator altogether.'},
  {k:'round', t:'Cp = 2.71 mg/L',
   why:'Two decimal places follows the precision of the 5.41 mg/L the decay started from. Dr. Mosley states the answer aloud as 2.7 mg/L, a one-decimal rounding of the same number, and either form carries full marks on her paper.'}],
 teach:'A post-cessation question is two problems in sequence. First find the concentration at the end of the infusion, which requires the fraction of steady state reached over the infused duration. Then decay that value for the stated time after cessation. Only an infusion long enough to reach steady state allows the first step to be skipped by using Css.',
 cite:'3IntravenousInfusions.pdf, slide "Example 6"',
 quote:'we expect the concentration 3 hours after a cessation of the 6 hour infusion. To be 2.7 mg per liter.'},

{id:'inf-n8', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'load', concept:'loading-dose-calc', skill:'loading',
 source:'both',
 stem:'A physician wants to administer an agent at a rate of 20 mg/hr by IV infusion. The elimination rate constant is 0.16 hr⁻¹ and the volume of distribution (one compartment) is 10 L. What loading dose should be recommended if the drug level is to reach 12.5 mcg/mL immediately?',
 units:'mg',
 answer:125,
 tol:2,
 steps:[
  {k:'setup', t:'DL = R / k',
   why:'The loading dose is the amount of drug the infusion would eventually hold in the body, which is the rate of input divided by the fractional rate of removal. This is the route printed on the slide, and it is valid here because the stated rate is the one that produces the wanted concentration.'},
  {k:'algebra', t:'DL = (20 mg/hr) / (0.16 hr⁻¹) = 125 mg',
   why:'Milligrams per hour divided by reciprocal hours leaves milligrams, which is what a dose must be. Dividing by a rate constant is the same as multiplying by a time, which is why an amount comes out of a rate.'},
  {k:'unit', t:'12.5 mcg/mL = 12.5 mg/L',
   why:'Micrograms per millilitre and milligrams per litre are numerically the same, as she tells the class to assume rather than convert. Making the substitution allows the target concentration to be used directly with a volume of distribution in litres.'},
  {k:'algebra', t:'Check: DL = Css · VD = (12.5 mg/L)(10 L) = 125 mg',
   why:'The second route multiplies the wanted concentration by the volume that has to be filled, and milligrams per litre times litres leaves milligrams. Both routes give 125 mg, which is the answer she states, and their agreement confirms the infusion rate matches the target.'},
  {k:'round', t:'DL = 125 mg',
   why:'Both routes give 125 mg, which is the value she states, so no rounding decision arises and the whole number stands as computed. The unit is milligrams because a loading dose is an amount rather than a concentration or a rate.'}],
 teach:'A loading dose is the amount of drug needed in the body to produce the target concentration immediately. It can be found from the target concentration multiplied by the volume of distribution, or from the infusion rate divided by the elimination rate constant. The two agree only when the infusion rate has itself been chosen for that target, which is why she shows both and treats disagreement as a sign the rate was picked arbitrarily.',
 cite:'3IntravenousInfusions.pdf, slide "Example 7"',
 quote:'What loading dose should be recommended if the doctor wants the drug level to reach 12.5 mcg/mL immediately?',
 note:'The slide states the infusion rate as 20 mg/hr. The 09-02 captions read the rate as "2 mg per hour" when the problem is posed but as 20 mg/hr twice in the solution, and only 20 mg/hr reproduces her stated answer of 125 mg, so the slide value is used.'},

{id:'inf-n9', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:3, lecture:'L04',
 topic:'infusion', sub:'load', concept:'loading-plus-infusion', skill:'conctime',
 source:'both',
 stem:'An IV bolus loading dose of 288 mg is administered simultaneously with a continuous infusion of the same drug at 50 mg/hr. The drug has a half-life of 4 hours and a volume of distribution of 12 L. What is the plasma concentration 2 hours after the start of therapy?',
 units:'mg/L',
 answer:24.0,
 tol:0.5,
 steps:[
  {k:'setup', t:'Cp = (DL/VD)e^(−kt) + (R/(k·VD))(1 − e^(−kt))',
   why:'Two inputs are running at once, so the concentration is the sum of the decaying bolus curve and the rising infusion curve. The first term is an ordinary bolus starting at the loading dose divided by the volume of distribution; the second is the infusion term already in use.'},
  {k:'algebra', t:'k = 0.693 / 4 hr = 0.17325 hr⁻¹',
   why:'Both terms are written in terms of the rate constant, so the half-life is converted once and used in both. Keeping five decimal places here avoids the rounding drift she warns about when k is truncated early.'},
  {k:'algebra', t:'Bolus term = (288 mg / 12 L)e^(−(0.17325)(2)) = (24 mg/L)e^(−0.3465) = (24 mg/L)(0.7072) = 16.97 mg/L',
   why:'The loading dose divided by the volume of distribution gives the concentration the bolus produces at time zero, and two hours of first-order decay reduces it by the exponential factor. Milligrams divided by litres leaves milligrams per litre.'},
  {k:'algebra', t:'Infusion term = (50 mg/hr / ((0.17325 hr⁻¹)(12 L)))(1 − e^(−0.3465)) = (24.05 mg/L)(0.2928) = 7.04 mg/L',

{id:'m4-rou-1', prof:'Mosley', tier:'new', exam:2, module:4, lecture:'L05',

   why:'This has the two organs the right way round for nothing: the kidney is the main site of excretion and the liver the main site of biotransformation, so the option reverses them. The two major elimination organs are the kidney and the liver, and matching each to its characteristic process is exactly what this distractor tests.'},
  {t:'Excretion applies to metabolites only; biotransformation applies to parent drug', correct:false,
   why:'Choosing this reads excretion as though it applied only to what biotransformation has already produced, which restricts it to the second half of elimination. Excretion covers removal of intact drug or of metabolite; the defining feature is that the molecule leaves the body unaltered at the point of removal, not which species is being removed. The error matters numerically: if excretion could not remove parent drug, the fraction excreted unchanged would be zero for every drug and renal clearance taken as fe times total clearance would collapse to zero with it. What separates the two mechanisms is whether the molecule is chemically converted first.'}],
 teach:'The two elimination mechanisms differ in whether the molecule survives. Excretion physically removes drug from the body without altering it. Biotransformation alters it first, usually into something the body can then eliminate more readily. The distinction matters numerically because the fraction excreted unchanged is measured by collecting the parent drug in urine, and everything not recovered that way is attributed to metabolism.',
 cite:'4---Clearance-and-Elimination.pdf slide 3, and slide 24',
 quote:'Biotransformation or drug metabolism—drug is chemically converted in the body to a metabolite'},

{id:'m4-rou-3', prof:'Mosley', tier:'new', exam:2, module:4, lecture:'L05',
 topic:'clearance', sub:'routes', concept:'elimination-organs', skill:'recall',
 source:'both',
 stem:'Which two organs are the major sites of drug elimination in the body?',
 options:[
  {t:'The kidney and the liver', correct:true,
   why:'The kidney excretes drug into urine and the liver biotransforms it, so between them they cover both elimination mechanisms. This pairing is what makes total body clearance separable into a renal part and a hepatic part, which is the arithmetic the rest of the module runs on. Dr. Mosley states it plainly as our main organs of elimination, the kidneys and the liver.'},
  {t:'The kidney and the lung', correct:false,
   why:'The lung matters for volatile agents but it is not one of the two organs the additivity of clearance is built around here. Choosing it leaves the liver out, and with it every metabolic route, so hepatic clearance would have nowhere to come from.'},
  {t:'The liver and the gut wall', correct:false,
   why:'Picking the gut wall substitutes a site of absorption loss for an organ of elimination. Loss at the gut wall reduces how much drug arrives in the circulation, which is a bioavailability matter, and it removes nothing that is already there. Dropping the kidney also removes the only organ whose clearance can be obtained from a urine collection, and without that measurement hepatic clearance could not be reached by subtraction from the total. The two elimination organs are the kidney and the liver.'},
  {t:'The kidney and the spleen', correct:false,
   why:'This keeps the kidney, which is the half most students are sure of, and substitutes a guess for the metabolic organ rather than recalling that it is the liver. The spleen has no assigned role as an organ of drug elimination in this course. The pair is fixed by the two mechanisms: one organ excretes intact drug and the other biotransforms it, which is what makes total clearance the sum of a renal and a hepatic part. With the spleen in the liver\'s place there is no organ left for hepatic clearance to come from.'}],
 teach:'Two organs and two mechanisms line up with each other. The kidney is where intact drug is excreted, and its contribution is renal clearance. The liver is where drug is biotransformed, and its contribution is hepatic clearance. Total body clearance is their sum, so naming the organs and writing ClT = ClR + ClH are the same statement made twice.',
 cite:'4---Clearance-and-Elimination.pdf slide 3',
 quote:'Kidney and liver are the two major drug elimination organs in the body'},

/* ════════════════ WHAT CLEARANCE IS ════════════════ */

{id:'m4-cl-1', prof:'Mosley', tier:'new', exam:2, module:4, lecture:'L05',
 topic:'clearance', sub:'clcalc', concept:'clearance-definition', skill:'recall',
 source:'both',
 stem:'How is clearance defined?',
 options:[
  {t:'The volume of fluid removed of drug per unit time', correct:true,
   why:'Clearance is a volume cleared per unit time, which is why its units are always a volume over a time, such as litres per hour or millilitres per minute. It describes drug elimination from the body or from a single organ without identifying the individual processes involved, so it can be quoted for a drug whose routes of loss have never been separated. Dr. Mosley gave the same wording in her poll debrief, calling it the volume of fluid removed of drug per unit time.'},
  {t:'The amount of drug removed per unit time', correct:false,
   why:'This answers with the rate of elimination in place of the clearance, which is the quantity clearance multiplies a concentration by rather than the quantity itself. An amount per unit time falls as the plasma concentration falls, while clearance stays constant through a first-order decline, so the two cannot be the same number. They are tied together by rate of elimination equals clearance times plasma concentration, so substituting one for the other silently drops the concentration out of the relationship. Whether the unit begins with a mass or with a volume separates them at once.'},
  {t:'The fraction of drug removed per unit time', correct:false,
   why:'A fraction per unit time is the elimination rate constant k, so this substitutes k for clearance and loses the volume. Clearance is k multiplied by the apparent volume of distribution, which is why clearance carries a volume in its units and k carries reciprocal time only. Reading the definition as a fraction keeps the time part and discards the volume part, so the answer describes how fast a proportion of the drug is lost but not what volume of fluid that corresponds to. Two constants stand behind clearance and this option retains one of them.'},
  {t:'The time required to remove half of the drug present', correct:false,
   why:'That is the half-life, and reaching for it here means answering a question about a volume per unit time with a quantity measured in time alone. Clearance and half-life are connected through the volume of distribution, so knowing one does not turn it into the other. A stated half-life says nothing on its own about how many litres are cleared each hour, because that depends on the volume the drug occupies as well. The unit check settles it: hours cannot be litres per hour.'}],
 teach:'Clearance is a volume of fluid completely cleared of drug in each unit of time. The definition deliberately says nothing about how the drug is removed, which is what lets one number stand for filtration, secretion, metabolism and everything else at once. Because it is a volume per time, it can be attached to the whole body or to a single organ, and organ clearances add up to the total.',
 cite:'4---Clearance-and-Elimination.pdf slide 4',
 quote:'Volume of fluid removed of drug from the body per unit time'},

{id:'m4-cl-2', prof:'Mosley', tier:'new', exam:2, module:4, lecture:'L05',
 topic:'clearance', sub:'clcalc', concept:'clearance-definition', skill:'recall',
 source:'both', dupOf:'m4-cl-1',
 stem:'Clearance acts as a proportionality factor. Which two quantities does it relate?',
 options:[
  {t:'The rate of drug elimination and the plasma drug concentration', correct:true,
   why:'The slide defines clearance as the proportionality factor that relates rate of drug elimination to the plasma drug concentration, and writes it as rate of elimination equals Cl times Cp. Because the factor is constant, the rate of elimination rises and falls in step with the concentration, which is the first-order behaviour seen in every earlier module. Dr. Mosley calls this a third reason to like clearance, after its constancy and its link to the area under the curve.'},
  {t:'The amount of drug in the body and the measured plasma concentration', correct:false,
   why:'That proportionality is the volume of distribution, from Cp = DB/VD, and it converts an amount to a concentration rather than a rate to a concentration. The two constants are easy to swap because both have a volume in them, but only clearance carries a time. Whether the quantity being related is an amount or a rate is what decides which factor applies.'},
  {t:'The dose and the half-life', correct:false,
   why:'Picking this pairs two quantities that no proportionality factor connects, because in a linear first-order system the half-life does not move when the dose changes. The error is to read proportionality factor as meaning any two quantities that appear together in dosing, rather than the specific pair one constant sits between. Clearance sits between a rate and a concentration, so doubling the dose doubles the concentration and the rate together and leaves the half-life exactly where it was. Nothing on this point relates dose to half-life at all.'},
  {t:'The renal and hepatic clearances', correct:false,
   why:'Renal and hepatic clearance add rather than sit in proportion, and their relationship is ClT = ClR + ClH. This answer takes a true statement from the next slide and misreads addition as proportionality.'}],
 teach:'Clearance appears in three descriptions on these slides and all three are the same quantity. It is a volume of fluid cleared per unit time. It is the proportionality factor between the rate of elimination and the plasma concentration, written rate of elimination equals Cl times Cp. And it is the loss of drug across an organ of elimination, which is what allows renal and hepatic clearance to be quoted separately and then added.',
 cite:'4---Clearance-and-Elimination.pdf slide 5',
 quote:'Clearance can be defined as the proportionality factor that relates rate of drug elimination to the plasma (drug) concentration.'},

{id:'m4-cl-5', prof:'Mosley', tier:'new', exam:2, module:4, lecture:'L05',
 topic:'clearance', sub:'clcalc', concept:'clearance-auc', skill:'read',
 source:'both',
 stem:'In the relationship Cl = FD0/AUC, what does the capital F represent, and what value does it take for an intravenously administered dose?',
 options:[
  {t:'The bioavailability factor, taken as 1 for an intravenous dose', correct:true,
   why:'Capital F is the bioavailability factor, the fraction of the administered dose that reaches the systemic circulation. An intravenous dose is placed directly into the circulation, so none of it is lost before it arrives and F is assumed to be 1. That is why the relationship is usually quoted as clearance equals dose divided by area under the curve in this module, where every dose is intravenous.'},
  {t:'The fraction excreted unchanged, taken as 1 for an intravenous dose', correct:false,
   why:'The fraction excreted unchanged is lowercase fe, a different quantity entirely, and it is never 1 for a drug that is also metabolised. Dr. Mosley separates the two symbols explicitly because they are the commonest pair to confuse. An intravenous drug can be fully bioavailable and still have most of its dose metabolised rather than excreted.'},
  {t:'The free fraction of drug in plasma, taken as 1 for an intravenous dose', correct:false,
   why:'This attaches a protein-binding idea to a term that measures arrival, so the error is reading F as a fraction of drug rather than as a fraction of dose. Giving a drug intravenously places all of it in the circulation but does nothing to stop it binding to plasma protein, so a free fraction of 1 does not follow from the route. The route decides how much drug arrives; binding decides how much of what arrived is unbound. Bioavailability is settled at the point of entry, before any binding question arises.'},
  {t:'The fraction of drug metabolised, taken as 1 for an intravenous dose', correct:false,
   why:'Choosing this runs the same arithmetic on the complement, substituting the fraction metabolised for the fraction that reached the circulation. A metabolised fraction of 1 would mean nothing at all is excreted unchanged, so renal clearance taken as fe times total clearance would be zero for every intravenous drug. The worked 500-mg example has 300 mg recovered unchanged in the urine, which contradicts that reading directly. Capital F counts what arrived, not what happened to it afterwards.'}],
 teach:'Clearance ties the dose to the total systemic exposure. The area under the concentration-time curve measures how much drug the body actually saw, and the dose measures how much was given, so their ratio measures how efficiently the body removes it. The bioavailability factor sits in the numerator because only the part of the dose that reached the circulation contributed to the area, and for an intravenous dose that is all of it.',
 cite:'4---Clearance-and-Elimination.pdf slide 7',
 quote:'Clearance is directly related to the dose administered and to the overall systemic exposure achieved'},

{id:'m4-cl-7', prof:'Mosley', tier:'new', exam:2, module:4, lecture:'L05',
 topic:'clearance', sub:'clcalc', concept:'fe-vs-F', skill:'tell',
 source:'both',
 stem:'A question gives both a lowercase fe and a capital F for the same drug. What does each one measure?',
 options:[
  {t:'fe is the fraction excreted unchanged; F is the bioavailability factor', correct:true,
   why:'Lowercase fe is the fraction of the dose that appears unchanged in the urine, obtained as the cumulative urinary amount divided by the dose. Capital F is the fraction of the administered dose that reached the systemic circulation in the first place. Dr. Mosley states the pair side by side precisely because the two symbols look alike and measure opposite ends of the drug journey, one on the way in and one on the way out.'},
  {t:'fe is the free fraction; F is the fraction excreted unchanged', correct:false,
   why:'Choosing this means reading the subscript e as though it marked a free fraction, which imports a protein-binding idea into a pair of symbols that carry none. Every label then shifts one place along, so the fraction excreted unchanged ends up attached to capital F. The e stands for excreted, which fixes lowercase fe on its own, and capital F is the bioavailability factor. With fe read as a free fraction there is no symbol left for the quantity a urine collection actually measures.'},
  {t:'fe is the bioavailability factor; F is the fraction excreted unchanged in urine', correct:false,
   why:'This swaps the two symbols while keeping both meanings, so the error is one of pairing rather than of recall. The consequence is numerical: renal clearance would be computed as bioavailability times total clearance, and for an intravenous dose, where the bioavailability factor is 1, renal clearance would come out equal to total clearance and hepatic clearance zero. Lowercase fe is the fraction of the dose recovered unchanged in the urine; capital F is the fraction of the dose that reached the circulation. The subscript is what keeps them apart.'},
