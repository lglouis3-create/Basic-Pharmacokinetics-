  {k:'algebra', t:'ln C0 = 5.3827 + (0.13863 hr⁻¹ × 1.0 hr) = 5.3827 + 0.1386 = 5.5213, so C0 = e^5.5213 = 250.0 mcg/mL.',
   why:'Reciprocal hours multiplied by hours cancel, leaving a pure number that can be added to a logarithm. Taking the exponential returns the concentration in the units the table used. The result is larger than the one-hour value, which is the direction a back-extrapolation must move.'},
  {k:'setup', t:'Volume = amount dissolved ÷ initial concentration.',
   why:'A concentration is an amount per unit volume, so rearranging it for volume puts the amount on top. The whole 200 mg was dissolved and none had decomposed at time zero, so the amount to use is the full dose.'},
  {k:'round', t:'V = 200,000 mcg ÷ 250.0 mcg/mL = 800 mL.',
   why:'Micrograms divided by micrograms per millilitre leaves millilitres, and the microgram units cancel only because the dose was converted from 200 mg first. Her key prints 800 mL, which is exact at the precision of the data.'}],
 teach:'Backing out a preparation volume joins two separate ideas. The kinetics supply the concentration at time zero, which no sample measured directly, and the definition of concentration turns that into a volume. The same two-stage structure appears throughout the course whenever a volume of distribution is found from a dose and an extrapolated concentration. Getting the units to agree before dividing is where the work is, since the dose is quoted in milligrams and the concentration in micrograms per millilitre.',
 cite:'PHAR_4221_Homework_1.md, problem 1d; Introduction.pdf slide 18'},

{id:'m1-ord-n11', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:1, lecture:'L01',
 topic:'orders', sub:'zero', concept:'volume-from-c0', dupOf:'m1-ord-n10', skill:'vddose',
 source:'slide',
 stem:'Exactly 300 mg of a drug are dissolved into an unknown volume of distilled water. After complete dissolution, 1.0 mL samples were removed and assayed, giving 0.45 mg/mL at 0.5 hour and 0.30 mg/mL at 2.0 hours. Assuming zero-order decomposition, what was the original volume of water in which the drug was dissolved?',
 units:'mL',
 answer:600,
 tol:10,
 steps:[
  {k:'setup', t:'For a zero-order process C = C0 − kt, so the rate constant is the slope of concentration against time with the sign reversed, and the volume then follows from V = dose ÷ C0.',
   why:'The order is stated in the stem, so the linear relation applies rather than the exponential one, and the two supplied points are all a straight line needs. The volume is what the question wants, and it is recoverable because the whole 300 mg was dissolved into it, so the dose and the concentration at the moment of dissolution together fix it.'},
  {k:'algebra', t:'k = −(C₂ − C₁) ÷ (t₂ − t₁) = −(0.30 − 0.45) mg/mL ÷ (2.0 − 0.5) hr = 0.15 ÷ 1.5 = 0.1 (mg/mL)/hr.',
   why:'The order is stated in the stem, so the linear relation applies and the rate constant is the slope with the sign reversed. Milligrams per millilitre divided by hours gives milligrams per millilitre per hour. Only two points are supplied, which is all a straight line needs.'},
  {k:'algebra', t:'A0 = C + kt = 0.30 mg/mL + (0.1 (mg/mL)/hr × 2.0 hr) = 0.30 + 0.20 = 0.5 mg/mL.',
   why:'The concentration at the moment of dissolution is the two-hour value plus everything lost in those two hours, and for a zero-order process that loss is the rate constant multiplied by the time. Either measured point gives the same starting value; using the 0.5-hour point gives 0.45 plus 0.05, which is also 0.5 mg/mL.'},
  {k:'algebra', t:'V = 300 mg ÷ 0.5 mg/mL = 600 mL.',
   why:'Milligrams divided by milligrams per millilitre leaves millilitres, and no unit conversion was needed because the dose and the concentration were both quoted in milligrams. The volume is larger than 300 mL because the starting concentration is below 1 mg per millilitre.'},
  {k:'round', t:'V = 600 mL.',
   why:'Her key prints 600 mL with no rounding shown, because every number in the chain divides exactly and no logarithm or exponential was evaluated anywhere in it. Millilitres are the unit the 1.0 mL assay samples were quoted in, so the answer is reported in the same measure.'}],
 teach:'This is the same two-stage calculation as the first-order version with one substitution: the starting concentration is recovered by adding back a fixed quantity rather than by multiplying by an exponential factor. Deciding which of the two recoveries applies is the only place the order enters, and the stem states it here rather than leaving it to be inferred. The final division is the definition of concentration rearranged for volume in both cases.',
 cite:'IntroductionandMathReview2Solutions.pdf, problem 3; Introduction.pdf slide 17'},

{id:'m1-ord-n12', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:1, lecture:'L01',
 topic:'orders', sub:'half', concept:'halflife-counting', skill:'krate',
 source:'slide',
 stem:'If the half-life for decomposition of a drug is 8 hours, how long will it take for 750 mg of the drug to decompose by 87.5 per cent? Assume first-order kinetics and constant temperature.',
 units:'hr',
 answer:24,
 tol:0.5,
 steps:[
  {k:'setup', t:'87.5 per cent decomposed leaves 12.5 per cent remaining, which is one eighth, or one half cubed.',
   why:'The percentage is given as what has gone and the half-life counts what remains, so it has to be turned round first. Recognising 12.5 per cent as a power of one half is what allows the problem to be finished without a calculator, which is how Dr. Mosley works it.'},
  {k:'algebra', t:'One eighth remains after 3 half-lives: 50 per cent decomposed at one, 75 per cent at two, 87.5 per cent at three.',
   why:'Each half-life removes half of what is still present, so the fraction remaining is halved at every step while the fraction decomposed climbs towards one hundred per cent. Building the short table is faster than the logarithmic route and produces the same answer exactly, because the target is a power of one half.'},
  {k:'algebra', t:'t = 3 × 8 hr = 24 hr.',
   why:'Multiplying a count of half-lives by the length of one half-life gives a time in hours. The 750 mg stated in the question is never used, because for a first-order process the time to reach a given percentage does not depend on the starting amount.'},
  {k:'round', t:'t = 24 hr.',
   why:'The answer is exact rather than rounded, because 87.5 per cent corresponds to a whole number of half-lives and no logarithm had to be evaluated. Dr. Mosley prints 24 hours and reaches it by this same three-step count rather than by an equation.'}],
 teach:'Where the fraction remaining is a power of one half, counting half-lives answers the question without any logarithm. Fifty per cent decomposed is one half-life, 75 per cent is two, 87.5 per cent is three, and the pattern continues to 99.9 per cent at ten. The same count works for amounts, concentrations and percentages alike, because for a first-order process all three fall by the same factor in the same time. Where the fraction is not a power of one half, the logarithmic route is needed instead.',
 cite:'IntroductionandMathReviewSolutions.pdf, problem 3; Introduction.pdf slide 19',
 quote:'First-order process with a 8 hour half-life, 50% of drug should be decomposed in one half-life (8 hours), 75% should be decomposed in two half-lives (16 hours), and 87.5% decomposed in 3 half-lives (24 hours).'},

{id:'m1-ord-n14', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:1, lecture:'L01',
 topic:'orders', sub:'half', concept:'paired-order-halflife', skill:'krate',
 source:'both',
 stem:'A solution of a drug was freshly prepared at a concentration of 300 mg/mL. After 30 days, the drug concentration in the solution was 80 mg/mL. Assuming first-order kinetics, when will the drug decline to one-half of the original concentration?',
 units:'days',
 answer:15.7,
 tol:0.5,
 steps:[
  {k:'setup', t:'k = ln(C0 ÷ C) ÷ t = ln(300 ÷ 80) ÷ 30 days.',
   why:'Two concentrations and the time between them determine the first-order rate constant, and here the earlier concentration is the initial one, so no back-extrapolation is needed. The milligram per millilitre units cancel inside the logarithm. The elapsed time is in days, so the rate constant will be per day.'},
  {k:'algebra', t:'k = 1.32176 ÷ 30 days = 0.04406 day⁻¹, which Dr. Mosley reports as 0.044 day⁻¹.',
   why:'A pure number divided by days gives reciprocal days. She corrects herself aloud on the time unit while working this problem, having first said per hour, and the elapsed time of 30 days fixes it as per day.'},
  {k:'setup', t:'t½ = 0.693 ÷ k.',
   why:'The question asks when the concentration reaches one half of its original value, which is the definition of the half-life. Dr. Mosley notes that the wording, declines to one-half, is what identifies a half-life question.'},
  {k:'algebra', t:'t½ = 0.693 ÷ 0.04406 day⁻¹ = 15.73 days.',
   why:'Dividing a dimensionless logarithm by a quantity in reciprocal days leaves days, so the result is a time and carries no reciprocal unit. As a check on direction, the concentration has already fallen well past half of 300 by day 30, so a half-life shorter than 30 days is what the data demand.'},
  {k:'round', t:'t½ = 15.7 days.',
   why:'Her worked answer prints 15.7 days, to one decimal place, which matches the precision of a rate constant she reports as 0.044 per day. Carrying the unrounded rate constant instead gives 15.73 days, a difference far too small to change any conclusion drawn from it.'}],
 note:'The transcript of the exam review renders the rate constant once as "0.044 per hour" and once as "0.0044"; the elapsed time of 30 days and her own printed half-life of 15.7 days are both consistent only with 0.044 per day. An exam written from these lectures would key 15.7 days.',
 teach:'This stem is one Dr. Mosley reuses, always with two parts that work the same two concentrations first as a first-order process and then as a zero-order one. The first-order half-life comes from the rate constant alone and is independent of where the concentration started. Because the question asks when the concentration declines to one half of the original, and the original concentration is the one at time zero, the half-life answers it directly with no further step.',
 cite:'RecapExam1.pdf, slide "Practice" (Module 1); Introduction.pdf slide 19',
 quote:'Assuming first-order kinetics, when will the drug decline to one-half of the original concentration?'},

{id:'m1-ord-n15', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:1, lecture:'L01',
 topic:'orders', sub:'half', concept:'paired-order-halflife', dupOf:'m1-ord-n14', skill:'krate',
 source:'both',
 stem:'A solution of a drug was freshly prepared at a concentration of 300 mg/mL. After 30 days, the drug concentration in the solution was 80 mg/mL. Assuming zero-order kinetics, when will the drug decline to one-half of the original concentration?',
 units:'days',
 answer:20.45,
 tol:0.6,
 steps:[
  {k:'setup', t:'k = (C0 − C) ÷ t = (300 − 80) mg/mL ÷ 30 days.',
   why:'Under the zero-order assumption the concentration falls linearly, so the rate constant is the quantity lost divided by the time taken. The same two data points are used as in the first-order version; only the relation applied to them changes. Milligrams per millilitre divided by days gives milligrams per millilitre per day.'},
  {k:'algebra', t:'k = 220 ÷ 30 = 7.333 (mg/mL)/day, which Dr. Mosley reports as 7.33 (mg/mL)/day.',
   why:'The rate constant is a rate here rather than a proportion, so it carries concentration per unit time. Every day the solution loses the same 7.33 mg/mL whatever remains, which is the assumption being tested.'},
  {k:'setup', t:'t½ = C0 ÷ 2k.',
   why:'Half of 300 mg/mL has to be removed, and the rate constant states how much is removed per day, so the time is the quantity to remove divided by that rate. Unlike the first-order case, the starting concentration appears explicitly and the answer would change if it did.'},
  {k:'algebra', t:'t½ = 300 mg/mL ÷ [2 × 7.333 (mg/mL)/day] = 300 ÷ 14.666 = 20.45 days.',
   why:'The concentration units cancel and the reciprocal day inverts, leaving days. Using her rounded 7.33 per day in place of the unrounded 7.333 gives 20.46 days instead, a difference too small to change any conclusion, which is why either carries full marks.'},
  {k:'round', t:'t½ = 20.45 days.',
   why:'Dr. Mosley reports 20.45 days, to two decimal places, worked from the unrounded rate constant. The zero-order half-life is far longer than the first-order one for the same pair of points, because a zero-order process removes a fixed amount per day rather than a fixed fraction.'}],
 note:'Her handwriting on the RecapExam1 slide records 20.463 days, which follows from the rounded rate constant of 7.33; she says 20.45 days aloud in the exam review, which follows from the unrounded 7.3333. The printed slide gives no answer. Both readings are within the tolerance set here, and an exam written from these lectures would accept either.',
 teach:'The paired stem works the same two measurements under both assumptions so that the two half-life relations can be compared side by side. The zero-order answer is the larger of the two here, and it would change if the starting concentration changed, whereas the first-order answer would not. Nothing in the data itself selects an order in this problem, because two points lie on both a straight line and an exponential; the stem states which assumption to make.',
 cite:'RecapExam1.pdf, slide "Practice" (Module 1); Introduction.pdf slide 19'},

{id:'m1-ord-n16', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:1, lecture:'L01',
 topic:'orders', sub:'half', concept:'halflife-counting', dupOf:'m1-ord-n12', skill:'krate',
 source:'slide',
 stem:'How many half-lives would it take for 99.9 per cent of any initial concentration of a drug to decompose? Assume first-order kinetics.',
 units:'half-lives',
 answer:10,
 tol:0.3,
 steps:[
  {k:'setup', t:'99.9 per cent decomposed leaves 0.1 per cent remaining, so C ÷ C0 = 0.001.',
   why:'The percentage is stated as what has decomposed and the equation works in what remains, so it has to be converted first. Taking 99.9 per cent straight into the equation as the remaining fraction gives an answer near zero, which is the usual error on this item.'},
  {k:'setup', t:'t = ln(C0 ÷ C) ÷ k, and k = 0.693 ÷ t½, so t = ln(1000) ÷ (0.693 ÷ t½) = [ln(1000) ÷ 0.693] × t½.',
   why:'Substituting the half-life relation for the rate constant expresses the time as a multiple of the half-life, which is what the question asks for. The starting concentration cancels, so the answer holds for any initial concentration, as the stem states.'},
  {k:'algebra', t:'ln(1000) ÷ 0.693 = 6.907755 ÷ 0.693 = 9.97 half-lives.',
   why:'Both quantities are pure numbers, so the result is a pure count of half-lives with no time unit attached. Her key prints 9.97 and takes it as 10.'},
  {k:'round', t:'t = 10 half-lives.',
   why:'Her table confirms the same answer without the logarithm: after 10 half-lives 0.1 per cent remains, which is 99.9 per cent decomposed. She uses this figure repeatedly, since a question asking for the time for 99.9 per cent of a drug to be eliminated always resolves to ten half-lives.'}],
 teach:'Ten half-lives is the standard count for practical completion of a first-order process, and it can be reached two ways. The logarithmic route gives 9.97 half-lives, and the halving table reaches 99.9 per cent decomposed at the tenth step. Dr. Mosley prints both, which is her habit whenever two independent routes to the same answer exist. The count is independent of the starting concentration, so the same ten half-lives applies to any dose.',
 cite:'IntroductionandMathReview2Solutions.pdf, problem 1; Introduction.pdf slide 19'},

/* ══════════════════ AUC ═══════════════════════════════════════════════ */

{id:'m1-auc-c01', prof:'Mosley', tier:'new', exam:1, module:1, lecture:'L01',
 topic:'auc', sub:'concept', concept:'auc-meaning', skill:'recall',
 source:'both',
 stem:'What does the area under the plasma concentration-versus-time curve tell you about a drug?',
 options:[
  {t:'The extent of drug available for the body to use', correct:true,
   why:'Area under the curve combines how high the concentration went with how long it stayed there, so it measures total exposure rather than any single moment of it. Dr. Mosley states it in exactly these terms on 19 August and again in the Exam 1 review. It is used to determine the extent of drug absorption or the effectiveness of a given drug after administration by a particular route.'},
  {t:'The rate at which the drug is absorbed from the dosage form', correct:false,
   why:'Rate of absorption is read from how quickly the curve rises and from the time of the peak, not from the area beneath it. Two formulations can produce the same area while reaching their peaks at different times. Area is an extent measure; rate is a shape measure.'},
  {t:'The half-life of the drug', correct:false,
   why:'Half-life comes from the slope of the declining portion of the curve on semi-logarithmic axes, which is a separate reading from the area. A drug with a long half-life will usually have a large area, but the two are not the same quantity and neither can be computed from the other alone. This answer substitutes a related property for the one asked about.'},
  {t:'The minimum toxic concentration of the drug', correct:false,
   why:'The minimum toxic concentration is a threshold level fixed by the drug and the patient, drawn as a horizontal line across the curve, and it does not come from the area. An area is a total, not a level. Nothing about integrating the curve produces a safety limit.'}],
 teach:'Area under the curve measures total exposure: the concentration integrated over time. That makes it the quantity for comparing how much drug the body actually received by two different routes or from two different formulations. Dividing the area after an oral dose by the area after an intravenous dose gives the bioavailability factor F, the fraction of the oral dose that enters the plasma. The total area is the sum of the areas of the individual segments the curve is broken into.',
 cite:'Introduction.pdf slides 22–23',
 quote:'for us, that tells us about the extent of drug that is available for the body to use'},

{id:'m1-auc-n01', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:1, lecture:'L01',
 topic:'auc', sub:'trap', concept:'trapezoidal-auc', skill:'auc',
 source:'slide',
 stem:'Plasma drug levels after a dose were as follows.\n\nTime (hr) | Plasma drug level (mcg/mL)\n0.5 | 38.9\n1 | 30.3\n2 | 18.4\n3 | 11.1\n4 | 6.77\n5 | 4.10\n\nWhat is the area under the curve from hours 2 to 4?',
 units:'mcg·hr/mL',
 answer:23.7,
 tol:0.5,
 steps:[
  {k:'setup', t:'The trapezoidal rule takes each segment as [(Cₙ₋₁ + Cₙ) ÷ 2] × (tₙ − tₙ₋₁), which is one half the sum of the two parallel sides times the width.',
   why:'Each pair of neighbouring points is joined by a straight line, making a trapezium whose parallel sides are the two concentrations and whose width is the time between them. Dr. Mosley reduces the printed formula to one half base times height. Summing the segments over the interval asked for gives the area across that interval.'},
  {k:'setup', t:'Hours 2 to 4 contain two segments: 2 to 3 hr and 3 to 4 hr, each 1 hour wide.',
   why:'Only the points inside the requested interval are used, so the 0.5-hour and 1-hour readings play no part and the 5-hour reading is beyond the upper limit. Counting the segments before computing anything prevents both including a segment outside the range and dropping one inside it.'},
  {k:'algebra', t:'Segment 1: [(18.4 + 11.1) mcg/mL ÷ 2] × 1 hr = 14.75 × 1 = 14.75 mcg·hr/mL.',
   why:'Averaging the two concentrations gives the height of a rectangle of equal area to the trapezium, and multiplying by the one-hour width gives the area. Micrograms per millilitre multiplied by hours gives micrograms times hours per millilitre.'},
  {k:'algebra', t:'Segment 2: [(11.1 + 6.77) mcg/mL ÷ 2] × 1 hr = 8.935 × 1 = 8.935 mcg·hr/mL.',
   why:'The same construction applies to the second trapezium, with the 3-hour concentration now the taller of its two sides. This segment is smaller than the first because the concentration has fallen further.'},
  {k:'algebra', t:'AUC = 14.75 + 8.935 = 23.685 mcg·hr/mL.',
   why:'The two segment areas are in the same unit and add directly, because each was already reduced to a concentration multiplied by a time. Adding rather than averaging is what the trapezoidal rule requires, since the segments sit side by side under the curve rather than overlapping.'},
  {k:'round', t:'AUC = 23.7 mcg·hr/mL.',
   why:'Dr. Mosley reports 23.7 for this interval, to three significant figures, which matches the precision of the tabulated concentrations. The unit is a concentration multiplied by a time, which is why it reads as micrograms times hours per millilitre rather than as a concentration.'}],
 teach:'The trapezoidal rule estimates the area beneath a set of measured points by joining neighbouring points with straight lines and adding the areas of the resulting trapezia. Each segment is the average of its two concentrations multiplied by the time between them. Because the true curve between two points is usually concave rather than straight, the estimate is approximate, and it improves as the sampling times get closer together. The unit of the result is always concentration multiplied by time.',
 cite:'Introduction.pdf slides 24–25',
 quote:'it is basically the calculations from, I’m gonna say math 0.5, like fifth grade math when you had geometry, where it’s one half base times height'},

{id:'m1-auc-n02', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:1, lecture:'L01',
 topic:'auc', sub:'trap', concept:'trapezoidal-auc', dupOf:'m1-auc-n01', skill:'auc',
 source:'slide',
 stem:'Plasma drug levels after a dose were as follows.\n\nTime (hr) | Plasma drug level (mcg/mL)\n0.5 | 38.9\n1 | 30.3\n2 | 18.4\n3 | 11.1\n4 | 6.77\n5 | 4.10\n\nWhat is the area under the curve from hours 0.5 to 2?',
 units:'mcg·hr/mL',
 answer:41.65,
 tol:0.8,
 steps:[
  {k:'setup', t:'Hours 0.5 to 2 contain two segments of unequal width: 0.5 to 1 hr, which is 0.5 hr wide, and 1 to 2 hr, which is 1 hr wide.',
   why:'The sampling times in this table are not evenly spaced, so each segment carries its own width and a single width cannot be factored out of the sum. Reading the widths off the time column before starting is what prevents the first segment being given a full hour.'},
  {k:'algebra', t:'Segment 1: [(38.9 + 30.3) mcg/mL ÷ 2] × 0.5 hr = 34.6 × 0.5 = 17.30 mcg·hr/mL.',
   why:'The two concentrations average to 34.6 mcg/mL and the interval is half an hour, so the area is half of that average. Micrograms per millilitre multiplied by hours gives micrograms times hours per millilitre.'},
  {k:'algebra', t:'Segment 2: [(30.3 + 18.4) mcg/mL ÷ 2] × 1 hr = 24.35 × 1 = 24.35 mcg·hr/mL.',
   why:'This segment is wider and its concentrations are lower, and the two effects work against each other, which is why it is the larger of the two areas despite sitting later on the curve. The width has to be taken from the time column rather than assumed.'},
  {k:'algebra', t:'AUC = 17.30 + 24.35 = 41.65 mcg·hr/mL.',
   why:'The segment areas share a unit and add directly. The result is larger than the area from hours 2 to 4 because the concentrations over this earlier interval are higher, which is the expected direction for a curve that is declining throughout.'},
  {k:'round', t:'AUC = 41.65 mcg·hr/mL.',
   why:'The value is reported to two decimal places, which is what the half-hour and one-hour segment widths support without inventing precision. The unit is again a concentration multiplied by a time, unchanged by the unequal segment widths used over this earlier stretch of the curve.'}],
 teach:'Nothing in the trapezoidal rule requires evenly spaced samples; each segment simply uses the interval between its own two points. That makes the rule usable on any sampling schedule, which matters because pharmacokinetic sampling is usually dense early and sparse late. Assuming a uniform width is the error that unevenly spaced tables are set to catch, and it changes the answer by whatever the mismatched intervals amount to.',
 cite:'Introduction.pdf slides 24–25'},

];

/* ==========================================================================
   MODULE 2 — IV BOLUS, ONE- AND MULTI-COMPARTMENT
   ==========================================================================
   Exam 1, module 2. L02 = one-compartment IV bolus (24 August);
   L03 = multicompartment IV bolus (26 August). Deck for both:
   2IVBolusAdministration.pdf. Revision slides: RecapExam1.pdf.
   Equation sheet: BasicPharmacokineticsEquations.pdf.

   TOPICS is declared in the first question file, not here.
   ========================================================================== */
const Q_MODULE2 = [

/* ════════════════ L02 — ONE-COMPARTMENT IV BOLUS ════════════════ */

/* ---------- the model and its assumptions ---------- */
{id:'m2-mod-1', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'model', concept:'onecpt-assumptions', skill:'recall',
 source:'both',
 stem:'A drug is given by intravenous bolus injection and is described by a one-compartment open model. What does the model assume happens to the dose?',
 options:[
  {t:'All of it enters at once and distributes uniformly', correct:true,
   why:'The bolus puts the whole dose into the body instantaneously, and the one-compartment assumption says the drug spreads evenly through that single body compartment at the same instant. Dr. Mosley states both halves together and then says plainly that this does not actually happen, so the model is a simplification chosen because it is the simplest way to describe distribution and elimination. Elimination begins the moment the drug is in, so there is no lag between input and loss.'},
  {t:'All of it enters at once and then distributes over several hours', correct:false,
   why:'A distribution step that takes measurable time is what forces a second compartment, so describing one is describing the two-compartment model instead. The one-compartment model has no distribution phase at all; the drug is uniform from time zero. Choosing this means holding the instantaneous input but not the instantaneous distribution.'},
  {t:'It enters at a constant rate and distributes uniformly', correct:false,
   why:'Constant-rate input is intravenous infusion, which is a zero-order process at the input end and belongs to a later module. The word bolus is what fixes the input as instantaneous, so attaching a rate to it replaces the mode of administration named in the question.'},
  {t:'It enters at once and stays in the plasma until elimination begins', correct:false,
   why:'This adds a waiting period before elimination starts, which the model does not have. Dr. Mosley says all the drug goes in and all the drug goes out, and that as soon as the drug is in the body it starts immediately being eliminated. Confining the dose to plasma also confuses the plasma sample with the volume of distribution.'}],
 teach:'The one-compartment open model makes two simplifications at once, and both are stated at time zero. The input is instantaneous, so the amount in the body at time zero is the whole dose. The distribution is instantaneous and uniform, so one measured plasma concentration describes the whole body. Open means drug can leave, and it leaves from that same instant. Everything else in this module, including Cp = DB/VD and the exponential decay, follows from those two assumptions.',
 cite:'2IVBolusAdministration.pdf, slide "One-Compartment Open Model: IV Bolus Administration"',
 quote:'the drug goes into the body all at once, like instantly all the drug is into the body and all the drug is instantly uniformly distributed throughout the body. Assumptions, simplifications, this does not happen.'},

{id:'m2-mod-2', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02', multi:true,
 topic:'bolus1', sub:'model', concept:'onecpt-assumptions', skill:'recall',
 source:'both', dupOf:'m2-mod-1',
 stem:'Select every statement that the one-compartment open model for intravenous bolus administration assumes. Select all that apply.',
 options:[
  {t:'The body behaves as a single uniform compartment', correct:true,
   why:'The body acts like a single, uniform compartment, which is what allows one plasma concentration to stand for the whole body. Uniform is the operative word: no region holds a different concentration from any other.'},
  {t:'Drug can both enter and leave the body', correct:true,
   why:'This is what open means in the model name. A closed compartment would retain everything put into it; the open model has an exit, and the differential equation dDB/dt = −kDB describes that exit as first order in the amount present.'},
  {t:'Input of the dose is instantaneous', correct:true,
   why:'Dr. Mosley calls this instantaneous input of drug into the body, and it is what distinguishes a bolus from an infusion. It sets the amount in the body at time zero equal to the full dose, which is the starting point for every calculation in this module.'},
  {t:'Drug concentration is the same in plasma and in tissue', correct:false,
   why:'Uniform distribution in the model means the drug behaves as though it occupies one compartment, not that a tissue biopsy and a plasma sample would read the same number. If they did, the volume of distribution would always equal a real physiological volume, and large volumes of distribution could not exist. This is the most common overreading of the word uniform.'},
  {t:'Elimination begins only after distribution is complete', correct:false,
   why:'There is nothing for elimination to wait for, because distribution is instantaneous in this model. The idea of waiting for distribution is imported from the two-compartment model, where a distribution phase genuinely precedes the elimination phase on the curve.'}],
 teach:'Three assumptions define the model and each one is doing a specific job. Instantaneous input fixes the starting amount. A single uniform compartment lets one measured plasma concentration represent the whole body. Open means elimination is running the whole time. Read the list as three separate claims rather than one, because exam distractors usually keep two and corrupt the third.',
 cite:'2IVBolusAdministration.pdf, slide "One-Compartment Open Model: IV Bolus Administration"',
 quote:'Assumes that the drug can enter and leave the body. Body acts like a single, uniform compartment'},

{id:'m2-mod-3', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'model', concept:'k-subscripts', skill:'tell',
 source:'both',
 stem:'In the relationship k = km + ke, what does a rate constant written as k with no subscript represent?',
 options:[
  {t:'The overall elimination rate constant', correct:true,
   why:'An unsubscripted k gathers every route by which the drug leaves the body into a single number. The slide splits it into km for metabolism and ke for excretion, and Dr. Mosley says that if you see k with no subscript, that is the overall rate constant for elimination, with all the processes wrapped up into it. Every calculation in this module that uses k is using that total.'},
  {t:'The rate constant for excretion only', correct:false,
   why:'Excretion has its own symbol, ke, precisely so that it can be separated from the total. Reading the bare k as excretion drops the metabolic route entirely, which would underestimate how fast the drug leaves and inflate any half-life computed from it.'},
  {t:'The rate constant for metabolism only', correct:false,
   why:'Metabolism is km. Picking this makes the same substitution error as picking excretion, and it is often made because metabolism is the route students meet first. The sum of the two subscripted constants, not either one alone, is what the concentration-time data actually measure.'},
  {t:'The transfer rate constant between plasma and tissue', correct:false,
   why:'Transfer between compartments is written k12 and k21, and those belong to the multicompartment model, where drug moves back and forth without leaving the body. A transfer constant describes redistribution; k describes irreversible loss. Confusing them puts a distribution term into an elimination calculation.'}],
 teach:'Subscripts on rate constants name the route. km is metabolism, ke is excretion, and the bare k is their sum, which is why it is called the overall elimination rate constant. Plasma concentration data see only the total, because the drug leaving by one route and the drug leaving by another are indistinguishable in a plasma sample. That is why k, and not km or ke, is what a concentration-time slope gives you.',
 cite:'2IVBolusAdministration.pdf, slide "One-Compartment Open Model: IV Bolus Administration"',
 quote:'KM is a rate constant for metabolism, KE is the rate constant for excretion … If you see K with no subscript, that is our overall rate constant for elimination.'},

{id:'m2-mod-4', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'model', concept:'integrated-forms', skill:'read',
 source:'both',
 stem:'The decline of plasma concentration after an intravenous bolus can be written as Cp = Cp0·e^(−kt), as ln Cp = ln Cp0 − kt, or as log Cp = log Cp0 − kt/2.3. Which form does Dr. Mosley say she prefers?',
 options:[
  {t:'The natural-logarithm form', correct:true,
   why:'She states a preference for the natural-log equations while adding that either one gets you there, so the base-ten form is not wrong, just not her route. The natural-log form needs no conversion factor, which is why the 2.3 never appears in her worked solutions. Her keys throughout the IV bolus practice sets compute k as ln of a concentration ratio divided by a time difference.'},
  {t:'The base-ten logarithm form', correct:false,
   why:'This is the form that carries the 2.3, and it is the one she works away from rather than toward. Choosing it usually comes from having met semi-logarithmic graph paper first, which is base ten, and assuming the algebra must match the graph paper. The two forms describe the same line; only the scaling of the slope differs.'},
  {t:'The exponential form', correct:false,
   why:'The exponential form is the one she uses for going forward from a known concentration to a later one, but it is not the form she names as preferred when the three are shown together. It is also the form where she warns about the sign of the exponent, since throwing in a minus when solving back to Cp0 produces a number lower than where you started.'},
  {t:'Whichever form the plotted axis uses', correct:false,
   why:'The axis of a plot decides how the data look, not which algebraic form you must solve with. A concentration measured at a time is the same number whichever equation you rearrange, so tying the choice of equation to the graph paper adds a constraint that does not exist.'}],
 teach:'The three forms are one relationship written three ways. Exponential form predicts a concentration at a time. Natural-log form linearises it so that a slope gives k directly. Base-ten log form linearises it for semi-logarithmic graph paper, and the 2.3 is only the conversion between the two logarithm bases. Since nothing physical changes between them, the choice is about which rearrangement is least error-prone, and she settles that by using natural logs throughout.',
 cite:'2IVBolusAdministration.pdf, slide "Concentration of Drug in the Plasma, Cp"',
 quote:'this is my preferred equations down here with natural log, but either one gets you there.',
 note:'The slide itself prints all three forms without marking a preference; the annotation "Dr. Mosley prefers this equation" on this copy of the deck is handwritten and is not used as the source here. The preference is taken from the 19 August transcript, where she says it about the same set of equations. An exam written from these lectures would accept any of the three forms, since the base-ten and exponential forms are both on the equation sheet.'},

/* ---------- volume of distribution ---------- */
{id:'m2-vd-1', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'vd', concept:'vd-definition', skill:'recall',
 source:'both',
 stem:'What does the apparent volume of distribution of a drug represent?',
 options:[
  {t:'A hypothetical volume that would hold the whole dose', correct:true,
   why:'The slide defines it as the hypothetical volume of body fluid that would be required to dissolve the total amount of drug at the same concentration as that found in the blood. Hypothetical is the load-bearing word: the number can exceed total body water, which no real volume can. Dr. Mosley says it is not an actual volume and that it depends on the drug.'},
  {t:'The total volume of blood and extracellular fluid present', correct:false,
   why:'Blood volume is a fixed physiological quantity of a few litres that does not change from drug to drug, whereas the volume of distribution does. A drug that sits almost entirely in tissue has a volume of distribution far larger than any blood volume, which is the clearest evidence that the two are different quantities.'},
  {t:'The volume of plasma completely cleared of drug each hour', correct:false,
   why:'That is the definition of clearance, and swapping the two is easy because both are quoted in units of volume. Clearance carries a time in its units and the volume of distribution does not, so checking whether the unit has a per-hour on it separates them immediately.'},
  {t:'The volume of the dosage form administered', correct:false,
   why:'The injected volume is a property of the preparation, not of how the drug behaves in the body, and changing the syringe volume would not change the concentration achieved. The volume of distribution is derived from the dose and the resulting plasma concentration, never from the formulation.'}],
 teach:'The volume of distribution answers one question: how big would a container have to be to hold this whole dose at the concentration actually measured in plasma? If the drug leaves the plasma for tissue, the measured plasma concentration is low, so the implied container is large. Nothing requires that container to correspond to an anatomical space, which is why it is called hypothetical and apparent.',
 cite:'2IVBolusAdministration.pdf, slide "Volume of Distribution"',
 quote:'The volume of distribution is a hypothetical volume of body fluid that would be required to dissolve the total amount of drug at the same concentration as that found in the blood.'},

{id:'m2-vd-2', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'vd', concept:'vd-definition', skill:'recall',
 source:'both', dupOf:'m2-vd-1',
 stem:'The volume of distribution acts as a proportionality constant. Which two quantities does it relate?',
 options:[
  {t:'The amount in the body and the plasma concentration', correct:true,
   why:'The slide calls it a proportionality constant relating the amount of drug in the body to the measured concentration in the biological fluid, and the relationship is written Cp = DB/VD. Because it is a constant, the same value converts amount to concentration at any time after the dose, not only at time zero.'},
  {t:'The dose and the elimination rate constant', correct:false,
   why:'Dose and elimination rate constant are independent of each other in a linear first-order system, so no constant links them. This answer usually comes from remembering that the volume of distribution appears in the clearance equation alongside k and assuming the pairing runs the other way.'},
  {t:'The plasma concentration and the elimination half-life', correct:false,
   why:'For a first-order process the half-life is the same at every concentration, so there is no proportionality between them to describe. That independence is one of the defining properties of first-order elimination, which makes this the exact opposite of a proportional relationship.'},
  {t:'The clearance and the area under the curve', correct:false,
   why:'Clearance and area under the curve are related, but through the dose, as Cl = D0/AUC, and the constant of proportionality there is the dose rather than the volume of distribution. Placing the volume of distribution in that relationship mixes up the two things clearance is liked for.'}],
 teach:'Calling the volume of distribution a proportionality constant is a statement about arithmetic, not anatomy. Amount and concentration are two readings of the same drug in the body, and one number converts between them in both directions: multiply concentration by the volume to get the amount, divide amount by the volume to get the concentration. Because the constant does not change with time, either reading can be converted to the other at any point on the curve.',
 cite:'2IVBolusAdministration.pdf, slide "Volume of Distribution"',
 quote:'we are talking about the volume distribution being a proportionality constant which relates the amount of drug into the in the body to whatever concentration we measure.'},

{id:'m2-vd-3', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'vd', concept:'vd-magnitude', skill:'apply',
 source:'both',
 stem:'Two drugs are given at the same dose to the same patient. Drug A has a much larger apparent volume of distribution than drug B. What does that tell you about drug A?',
 options:[
  {t:'It is more concentrated outside the vasculature', correct:true,
   why:'A large volume of distribution arises because the measured plasma concentration is low for the dose given, and the drug has to be somewhere, so it is in extravascular tissue. A large volume of distribution means more concentrated in extravascular tissues and less concentrated intravascularly. Dr. Mosley describes the same drug as widely distributed rather than hanging out in the plasma.'},
  {t:'It is more highly bound to plasma proteins', correct:false,
   why:'Heavy plasma protein binding holds drug in the vascular space, which raises the measured plasma concentration and therefore produces a smaller volume of distribution. This option states the opposite of the slide, and it is chosen when binding is read as a form of sequestration without asking where the drug is being held.'},
  {t:'It is eliminated more quickly', correct:false,
   why:'Elimination speed is set by clearance and by the rate constant, not by the volume of distribution alone. In fact, with clearance held constant a larger volume of distribution lengthens the half-life rather than shortening it, because k = Cl/VD. Reading a large volume as fast elimination inverts that relationship.'},
  {t:'It produces a higher initial plasma concentration', correct:false,
   why:'Initial plasma concentration is the dose divided by the volume of distribution, so with the dose fixed a larger volume gives a lower initial concentration. Selecting this treats a larger distribution volume as if it meant more drug rather than more space for the same drug.'}],
 teach:'The volume of distribution is read backwards from the plasma concentration. The dose is known, so a low measured concentration can only mean the drug is somewhere other than the sampled plasma, and the arithmetic reports that as a large volume. The reverse case is a drug held in the vascular space, whether by plasma protein binding or by poor tissue penetration: the plasma concentration is high and the computed volume is small.',
 cite:'2IVBolusAdministration.pdf, slide "Volume of Distribution" (second slide of that title)',
 quote:'Large VD → more concentrated in extravascular tissues and less concentrated intravascularly. Drug highly bound to plasma proteins or remaining in the vascular region → higher Cp and smaller VD'},

{id:'m2-vd-4', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'vd', concept:'vd-percent-bw', skill:'recall',
 source:'both',
 stem:'A 70 kg patient is given a drug whose apparent volume of distribution is 20% of body weight. What is the volume of distribution?',
 options:[
  {t:'14 L', correct:true,
   why:'Expressing the volume of distribution as a percent of body weight uses the convention that a 1 L volume is assumed to equal the weight of 1 kg, so 20% of 70 kg is 14 kg of body weight and therefore 14 L. Dr. Mosley works exactly this example aloud and insists on the unit: 14 L, not 14 kg, because the volume of distribution is a volume.'},
  {t:'14 kg', correct:false,
   why:'The arithmetic is right and the unit is wrong, and she corrects this out loud in class. A volume of distribution must be reported in units of volume; the kilogram only enters as the bridge that lets a percentage of body weight be converted into litres.'},
  {t:'20 L', correct:false,
   why:'This takes the percentage figure itself as the answer and never multiplies it by the patient weight. A percent of body weight is not a volume until a weight is supplied, which is why the stem gives one.'},
  {t:'3.5 L', correct:false,
   why:'This divides the weight by 20 instead of taking 20% of it, which is the same as using 5% of body weight. The error comes from treating the 20 as a divisor because volume of distribution often appears in a denominator elsewhere.'}],
 teach:'A volume of distribution can be quoted as an absolute volume, per kilogram of body weight, or as a percent of body weight. The percent form needs the one-to-one assumption that 1 L corresponds to 1 kg, and with that in hand the conversion is a single multiplication. In pharmacokinetics body weight is always in kilograms, so a weight given in pounds is converted first and the percentage applied afterwards.',
 cite:'2IVBolusAdministration.pdf, slide "Volume of Distribution" (second slide of that title)',
 quote:'In expressing the apparent VD in terms of percent body weight, a 1-L volume is assumed to be equal to the weight of 1 kg.'},

/* ---------- clearance ---------- */
{id:'m2-cl-1', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'cl', concept:'cl-definition', skill:'recall',
 source:'both',
 stem:'Which parameter describes the elimination of drug in terms of the volume of fluid cleared of drug per unit time?',
 options:[
  {t:'Clearance', correct:true,
   why:'The slide defines clearance as the volume of plasma that is cleared of drug per unit time, and as a measure of drug elimination from the body without identifying the mechanism or process. That last clause is why clearance can be quoted for a whole body without separating metabolism from excretion. Dr. Mosley repeats the definition almost word for word in the exam review.'},
  {t:'Excretion', correct:false,
   why:'Excretion names one route of loss, the removal of intact drug or metabolite, rather than a rate parameter with units. It answers where the drug goes, not how much volume is stripped of it per hour, so it cannot be the quantity the units describe.'},
  {t:'Elimination rate', correct:false,
   why:'An elimination rate is an amount per unit time, such as milligrams per hour, and for a first-order drug it changes continuously as the concentration falls. Clearance is what stays constant while that rate changes; multiplying clearance by the current concentration is what produces the rate.'},
  {t:'Biotransformation', correct:false,
   why:'Biotransformation is the chemical conversion of the drug to another species, so it is a process rather than a measurement. It contributes to clearance through hepatic metabolism, but it carries no volume-per-time meaning of its own.'}],
 teach:'Clearance is deliberately defined without naming a mechanism, so it can describe the whole body at once. Its units are volume per time, which is what makes it a clearance rather than a rate: it says how much fluid is completely stripped of drug each hour, not how many milligrams leave. The amount leaving follows from multiplying clearance by whatever concentration is present at the time.',
 cite:'2IVBolusAdministration.pdf, slide "Clearance"',
 quote:'Volume of plasma that is cleared of drug per unit time'},

{id:'m2-cl-2', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'cl', concept:'cl-equation-sheet', skill:'tell',
 source:'transcript',
 stem:'Two relationships in this course must be carried in memory because Dr. Mosley states they will not be supplied on the exam equation sheet. Which pair is it?',
 options:[
  {t:'Cl = k·VD and t½ = 0.693/k', correct:true,
   why:'She names both explicitly and in the same terms. On 19 August she says the first-order half-life will not be on the equation sheet, and on 24 August she says clearance equals k times VD is another one that will not be on your equation sheet. On 26 August she lists what is already in your bone marrow as clearance and half-life. Everything else she says she will supply.'},
  {t:'Cl = D0/AUC and Cp = DB/VD', correct:false,
   why:'Both of these are on the supplied sheet, so neither has to be supplied from memory. Choosing this pair usually comes from grouping all the clearance relationships together, when the carve-out she named is specifically the product form Cl = k·VD.'},
  {t:'t½ = 0.693/k and Cp = Ae^(−αt) + Be^(−βt)', correct:false,
   why:'The half-life is right and the biexponential equation is not. The two-compartment equations, including the biexponential form and the expressions for k, k12 and k21, are printed on the equation sheet, which is consistent with her saying she will simply give you A, B, alpha and beta.'},
  {t:'Cl = k·VD and the trapezoidal rule for AUC', correct:false,
   why:'Clearance is right and the trapezoidal rule is not. The trapezoidal expression is the first line of the supplied equation sheet, and she has never named it as something to be held in memory.'}],
 teach:'The equation sheet changes what a question is testing. Anything printed on it is testing whether you can choose and rearrange the right relationship. The two she withholds are the two that appear inside almost every other calculation, so a student who cannot produce them from memory cannot begin. Knowing which side of that line a relationship sits on is itself examinable information she has stated repeatedly.',
 cite:'Basic Pharmacokinetics - 08-26 Lecture.txt (quiz debrief); confirmed 08-19 and 08-24 lectures',
 quote:'this is another one that it will not be on your equation sheet cause I want you to take this one with you to your grave along with the half-life equation. Clearance is equal to k times vd.',
 note:'The printed slide carries Cl = kVD without saying whether it is supplied; the note "equation will not be given on EXAM" on this copy of the deck is handwritten and is not used as the source. The text extract of BasicPharmacokineticsEquations.pdf garbles several symbol-only lines, so the sheet cannot be read as confirming or contradicting this. The transcript statement, made three times across three lectures, is what an exam written from these lectures would key.'},

{id:'m2-cl-3', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02', multi:true,
 topic:'bolus1', sub:'cl', concept:'cl-constant', skill:'apply',
 source:'both',
 stem:'A drug follows one-compartment, first-order kinetics. Select every statement that is true of its total body clearance. Select all that apply.',
 options:[
  {t:'It is the product of k and the volume of distribution', correct:true,
   why:'Both k and VD are constants for a given drug in a given patient, so their product is a constant too. Dr. Mosley makes exactly that argument: a constant times a constant is a constant, which is the reason clearance is used as a parameter at all.'},
  {t:'It relates the dose directly to the area under the curve', correct:true,
   why:'Cl = D0/AUC stands on the same slide as Cl = k·VD, and she names this as another reason clearance is liked, because it ties the dose to the area under the curve without requiring any rate constant to be found first. That route is what makes clearance computable from a single dose and a full concentration-time profile.'},
  {t:'It increases in proportion to the plasma concentration present', correct:false,
   why:'This is the poll question she sets in class, and the answer she wanted was false. Changing the concentration changes the rate of elimination in milligrams per hour, but the volume stripped per hour is unchanged. Selecting this confuses the rate with the clearance, which is the single most common error on this parameter.'},
  {t:'It is expressed in units of volume rather than volume per time', correct:false,
   why:'Clearance is volume per unit time, usually litres per hour, and the per-hour is not optional. A quantity in plain litres is a volume of distribution, and dropping the time from the units is exactly what collapses the two parameters into each other.'}],
 teach:'Clearance is prized for being constant while everything visible is changing. The plasma concentration falls, the milligrams removed per hour fall with it, but the volume of plasma stripped of drug per hour does not move. Two routes lead to it: multiply the two constants k and VD, or divide the dose by the area under the whole curve. Both give the same number, in volume per unit time.',
 cite:'2IVBolusAdministration.pdf, slide "Clearance"',
 quote:'what we like about clearance is that clearance. For most drugs in most situations, it is going to be a constant … a constant times a constant is a constant.'},

/* ---------- L02 numeric: her eight-part battery ---------- */
{id:'m2-n-k1', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'k-from-two-points', skill:'krate',
 source:'slide',
 stem:'The data below are plasma concentrations of a new drug at different time points after an intravenous bolus injection of 50 mg to a 70-kg patient. Time (hr) and plasma concentration (mg/L): 0.5 and 2.52; 1.0 and 1.59; 1.5 and 1.00; 2.0 and 0.64; 2.5 and 0.40; 3.0 and 0.25. Using the 1.0 hr and 2.0 hr points, what is the elimination rate constant?',
 units:'hr⁻¹',
 answer:0.9100,
 tol:0.04,
 steps:[
  {k:'setup', t:'k = −slope = [ln Cp1 − ln Cp2] / (t2 − t1), taking the 1.0 hr and 2.0 hr points, which is the pair Dr. Mosley works in her own key',
   why:'On semi-logarithmic axes a first-order decline is a straight line whose slope is −k, so taking natural logarithms of two measured concentrations and dividing by the elapsed time recovers the rate constant. The pair is named in the question because it is the one her key uses; on a perfectly first-order line any pair would give the same slope, but these are measured concentrations rounded to two decimals, so different pairs differ slightly. The rate constant is never negative, so the minus sign is carried on the slope, not on k.'},
  {k:'algebra', t:'k = [ln 1.59 − ln 0.64] / (2.0 − 1.0) hr = ln(1.59/0.64) / 1.0 hr',
   why:'The difference of two natural logarithms is the natural logarithm of their ratio, which is the rearrangement she uses because the concentration units cancel inside the ratio and leave a pure number. Dividing that pure number by a time in hours is what produces reciprocal hours.'},
  {k:'algebra', t:'k = 0.91002 / 1.0 hr = 0.91002 hr⁻¹',
   why:'The ratio 1.59/0.64 is 2.4844 and its natural logarithm is 0.91002. Because the two sampling times are exactly one hour apart the division leaves the logarithm unchanged in magnitude and only attaches the reciprocal-hour unit.'},
  {k:'round', t:'k = 0.9100 hr⁻¹',
   why:'She reports rate constants to four decimal places, and she warns in class not to truncate k early because a k rounded to one or two figures propagates a large error into every later part. Four decimals is the precision her own key prints for this problem.'}],
 teach:'Every rate constant in this module comes from the same operation: take the natural logarithm of the ratio of two concentrations and divide by the time between them. The earlier concentration goes on top so that the ratio exceeds one and the logarithm is positive, which matches the rule that a rate constant is never negative. On data rounded to two decimal places, different pairs of points give slightly different answers, so a question that expects one particular value has to say which pair to use.',
 note:'Her key works the 1.0 hr and 2.0 hr points and prints 0.9100 hr⁻¹. The other adjacent pairs in the same table give 0.893 to 0.940 hr⁻¹, and a least-squares fit through all six points gives 0.922 hr⁻¹, so a student who picked a different pair has not made an error of method; the spread is measurement rounding in the printed concentrations, not a mistake. The tolerance is set wide enough to admit that spread.',
 cite:'IV-Bolus-Practice-1---Solutions.pdf, part a',
 quote:'k = −slope = −[ln 0.64 − ln 1.59] / (2 − 1) hr = 0.9100 hr⁻¹'},

{id:'m2-n-t1', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'halflife-from-k', skill:'krate',
 source:'slide',
 stem:'A drug given by intravenous bolus injection has an elimination rate constant of 0.91 hr⁻¹. What is its half-life of elimination?',
 units:'hr',
 answer:0.76,
 tol:0.03,
 steps:[
  {k:'setup', t:'t½ = 0.693 / k',
   why:'Setting the concentration to half its starting value in Cp = Cp0·e^(−kt) leaves the natural logarithm of two, 0.693, divided by the rate constant. This relationship is not on the equation sheet, so it has to be recalled rather than looked up.'},
  {k:'algebra', t:'t½ = 0.693 / 0.91 hr⁻¹',
   why:'The rate constant sits in the denominator of the rearranged equation. Dividing a pure number by a quantity in reciprocal hours gives hours, which is the check that the answer will come out as a time rather than a rate.'},
  {k:'round', t:'t½ = 0.76 hr',
   why:'The division gives 0.7615, which her key prints as 0.76 hr, two decimal places. Half-life must be reported in units of time and never in reciprocal time, a distinction she calls out by name in the exam review.'}],
 teach:'Half-life and the elimination rate constant are two readings of the same first-order decline, joined by the natural logarithm of two. Because that logarithm is a fixed number and k is fixed for a given drug and patient, the half-life is fixed too, which is why it does not depend on the starting concentration. The unit is always a time.',
 cite:'IV-Bolus-Practice-1---Solutions.pdf, part b',
 quote:'t½ = 0.693 / 0.91 hr = 0.76 hr'},

{id:'m2-n-c0a', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'c0-back-extrapolated', skill:'conctime',
 source:'slide',
 stem:'After an intravenous bolus injection of 50 mg, a drug with an elimination rate constant of 0.91 hr⁻¹ has a plasma concentration of 0.40 mg/L at 2.5 hours. What is the initial plasma concentration?',
 units:'mg/L',
 answer:3.89,
 tol:0.08,
 steps:[
  {k:'setup', t:'Cp0 = Cp·e^(+kt)',
   why:'Going backwards along the curve from a measured point to time zero reverses the sign of the exponent in Cp = Cp0·e^(−kt). She warns that always throwing in the minus sign here gives a number lower than the one you started from, which cannot be right, because the initial concentration must be the highest point in the data set.'},
  {k:'algebra', t:'Cp0 = (0.40 mg/L)·e^(0.91 hr⁻¹ × 2.5 hr)',
   why:'Reciprocal hours multiplied by hours leaves the exponent dimensionless, which it must be. The 2.5 hr is the full elapsed time from the dose to the sample being extrapolated from, so the whole decline over that interval is undone in one step.'},
  {k:'algebra', t:'Cp0 = (0.40 mg/L)(9.7279) = 3.8912 mg/L',
   why:'The exponent is 2.275 and e raised to it is 9.7279. Multiplying a concentration by a pure number keeps the concentration unit, so the answer is in milligrams per litre.'},
  {k:'round', t:'Cp0 = 3.89 mg/L',
   why:'Her key prints 3.89 mg/L, three significant figures. The value is higher than the earliest measured concentration of 2.52 mg/L at 0.5 hr, which is the sanity check she asks for: the initial concentration should be the highest point.'}],
 teach:'Back-extrapolation to time zero is the forward equation run in reverse, and the only change is the sign of the exponent. Any measured point on the line can be used, because the line is the same line, and the result is the concentration that would have been measured if sampling had been instantaneous. That extrapolated value, not the first measured sample, is what pairs with the dose to give the volume of distribution.',
 cite:'IV-Bolus-Practice-1---Solutions.pdf, part c',
 quote:'C₀ = (0.4 mg/L)e^(0.91)(2.5) = 3.89 mg/L'},

{id:'m2-n-c15', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'conc-at-15min', skill:'conctime',
 source:'slide',
 stem:'A drug given by intravenous bolus injection has an initial plasma concentration of 3.89 mg/L and an elimination rate constant of 0.91 hr⁻¹. What is the concentration of drug in the plasma 15 minutes after the dose was given?',
 units:'mg/L',
 answer:3.1,
 tol:0.1,
 steps:[
  {k:'unit', t:'15 min × (1 hr / 60 min) = 0.25 hr',
   why:'The rate constant is in reciprocal hours, so the time must be in hours before the two are multiplied or the exponent will be sixty times too large. She converts 15 minutes to 0.25 hr silently in her key, but the conversion is the step that decides whether the answer is right.'},
  {k:'setup', t:'Cp = Cp0·e^(−kt)',
   why:'This is the forward form of the integrated first-order equation, used whenever a concentration at a stated later time is wanted from a known starting concentration. The minus sign belongs here because the concentration is falling.'},
  {k:'algebra', t:'Cp = (3.89 mg/L)·e^(−0.91 hr⁻¹ × 0.25 hr) = (3.89 mg/L)(0.79652)',
   why:'The exponent is −0.2275, and e raised to it is 0.79652, the fraction of the starting concentration still present. Multiplying the initial concentration by that fraction gives the concentration at 15 minutes.'},
  {k:'round', t:'Cp = 3.0985 mg/L, reported as 3.1 mg/L',
   why:'Her key prints 3.1 mg/L. Since a quarter of an hour is well under one half-life of 0.76 hr, the answer must lie between 3.89 and half of 3.89, which it does.'}],
 teach:'Two things have to agree before this equation can be evaluated: the unit of time in the exponent and the unit of time in the rate constant. Every one of her problems states the interval in minutes at least once, and hours everywhere else, so the conversion is deliberate. Once the exponent is dimensionless, the exponential term is simply the fraction remaining, and multiplying it by the starting concentration finishes the problem.',
 cite:'IV-Bolus-Practice-1---Solutions.pdf, part d',
 quote:'C₀.₂₅ = (3.89 mg/L)e^−(0.91)(0.25) = 3.1 mg/L'},

{id:'m2-n-vd1', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'vd-from-dose-c0', skill:'vddose',
 source:'slide',
 stem:'A 50 mg intravenous bolus dose produces an initial plasma concentration of 3.89 mg/L in a 70-kg patient. What is the apparent volume of distribution?',
 units:'L',
 answer:12.85,
 tol:0.2,
 steps:[
  {k:'setup', t:'VD = DB / Cp, with DB = D0 at time zero',
   why:'The volume of distribution is the proportionality constant between the amount of drug in the body and the measured plasma concentration, so rearranging Cp = DB/VD puts the amount on top. Immediately after a bolus the amount in the body is the whole dose, which is what lets the dose be used here.'},
  {k:'algebra', t:'VD = 50 mg / 3.89 mg/L',
   why:'The milligrams cancel between numerator and denominator and the litre in the denominator of the concentration inverts, leaving litres. That unit check is also the apples-to-apples check she insists on: an amount is divided by a concentration, never by another amount.'},
  {k:'round', t:'VD = 12.853 L, reported as 12.85 L',
   why:'Her key prints 12.85 L, two decimal places. The patient weight of 70 kg is given in the stem and is not used, which is a habit of hers in these problems.'}],
 teach:'The volume of distribution is always the amount in the body divided by the concentration at the same instant. The convenient instant is time zero, because the amount there is the whole dose and the concentration there is the back-extrapolated initial value. Using a measured later concentration with the full dose would pair an amount from one time with a concentration from another, which is the mismatch she warns about.',
 cite:'IV-Bolus-Practice-1---Solutions.pdf, part e',
 quote:'V_D = 50 mg / 3.89 mg/L = 12.85 L'},

{id:'m2-n-cl1', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'cl-from-k-vd', skill:'clearance',
 source:'slide',
 stem:'A drug has an apparent volume of distribution of 12.85 L and an elimination rate constant of 0.91 hr⁻¹ in a patient. What is the total body clearance of this drug in this patient?',
 units:'L/hr',
 answer:11.7,
 tol:0.3,
 steps:[
  {k:'setup', t:'ClT = k · VD',
   why:'Total body clearance is the product of the overall elimination rate constant and the volume of distribution. This relationship is one of the two she says will not be supplied on the equation sheet, so it has to be recalled. Both factors are constants, which is why their product is constant too.'},
  {k:'algebra', t:'ClT = (12.85 L)(0.91 hr⁻¹) = 11.6935 L/hr',
   why:'Litres multiplied by reciprocal hours gives litres per hour, which is the unit a clearance must carry. A result in plain litres would mean the rate constant had been left out and a volume of distribution reported instead.'},
  {k:'round', t:'ClT = 11.694 L/hr, reported as 11.7 L/hr',
   why:'Her key prints 11.7 L/hr, three significant figures. Carrying both inputs unrounded, as VD = 12.8535 L and k = 0.91002 hr⁻¹, gives 11.697 L/hr, which rounds to the same value.'}],
 teach:'Clearance in this course is reached by multiplying the two parameters that have already been found. The rate constant says what fraction of the body content leaves per hour; the volume of distribution says how large the body content appears to be; their product says how much volume is stripped of drug per hour. Because both inputs are constants for the drug in that patient, the clearance does not change as the concentration falls.',
 cite:'IV-Bolus-Practice-1---Solutions.pdf, part f',
 quote:'Cl_T = (12.85 L)(0.91 hr⁻¹) = 11.7 L/hr'},

{id:'m2-n-d3a', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'amount-at-t', skill:'conctime',
 source:'slide',
 stem:'A 50 mg intravenous bolus dose of a drug with a volume of distribution of 12.85 L gives a plasma concentration of 0.25 mg/L at 3 hours. What is the amount of drug in the body 3 hours after the drug was administered?',
 units:'mg',
 answer:3.2,
 tol:0.15,
 steps:[
  {k:'setup', t:'DB = VD · Cp, evaluated at 3 hr',
   why:'The volume of distribution converts a concentration into an amount at any time, not only at time zero, because it is a constant. Since the plasma concentration at 3 hours is already given, this is the shorter of the two routes her key shows.'},
  {k:'algebra', t:'DB = (12.85 L)(0.25 mg/L) = 3.2125 mg',
   why:'Litres multiplied by milligrams per litre leaves milligrams, which is the unit an amount must have. Getting litres out instead would mean the two quantities had been divided rather than multiplied.'},
  {k:'algebra', t:'Alternative route: DB = D0·e^(−kt) = (50 mg)·e^(−0.91 hr⁻¹ × 3 hr) = 3.2610 mg',
   why:'The same amount can be found by decaying the whole dose forward for three hours, which avoids needing the volume of distribution. She prints both routes deliberately. The two differ slightly only because the 0.25 mg/L reading is rounded to two decimal places in the data table.'},
  {k:'round', t:'DB = 3.2 mg by either route',
   why:'Her key gives 3.2 mg from both calculations. Reporting to two significant figures is what makes the two routes agree, which is her reason for showing them side by side.'}],
 teach:'An amount in the body at a stated time can be reached from either direction. If a concentration at that time is available, multiply it by the volume of distribution. If it is not, decay the dose forward with the exponential equation. Both work because the volume of distribution is constant and the decline is first order, so the two answers must agree to within the rounding of the data.',
 cite:'IV-Bolus-Practice-1---Solutions.pdf, part g',
 quote:'D₃ = (12.85 L)(0.25 mg/L) = 3.2 mg or D₃ = 50 mg · e^−(0.91)(3) = 3.2 mg'},

{id:'m2-n-999a', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'time-to-999', skill:'krate',
 source:'slide',
 stem:'A drug given by intravenous bolus injection has an elimination half-life of 0.76 hours. How much time is required for 99.9% of the drug to be eliminated from the body?',
 units:'hr',
 answer:7.6,
 tol:0.2,
 steps:[
  {k:'setup', t:'99.9% eliminated corresponds to 10 half-lives',
   why:'For a first-order process each half-life leaves half of what was there, so after ten half-lives 0.1% remains and 99.9% has gone. Dr. Mosley states the ten-half-life figure outright as a fact to carry, and her Module 1 key builds the same result from a table of percent remaining.'},
  {k:'algebra', t:'t = 10 × t½ = 10 × 0.76 hr = 7.6 hr',
   why:'Multiplying a count of half-lives by the length of one half-life gives a time. Nothing needs to be exponentiated because the percentage asked for is a power of one half, which is the route she prefers whenever it is available.'},
  {k:'algebra', t:'Logarithmic route: t = ln(100/0.1) / k = ln(1000) / 0.91 hr⁻¹ = 7.591 hr',
   why:'Setting the fraction remaining to 0.001 in Cp = Cp0·e^(−kt) and solving for t gives the natural logarithm of 1000 divided by k. This is the general route for percentages that are not powers of one half, and she prints it beside the half-life count in the parallel problem.'},
  {k:'round', t:'t = 7.6 hr',
   why:'Her key gives 7.6 hr. The small gap between 7.6 and the exact 7.59 is the rounding already carried in the half-life of 0.76 hr, so both routes report the same answer at this precision.'}],
 teach:'Elimination of a fixed percentage takes a fixed number of half-lives regardless of the dose, because a first-order process removes proportions rather than amounts. Ten half-lives for 99.9% recurs in every one of her bolus problem sets. When the percentage is not a clean power of one half, set the fraction remaining into the exponential equation and solve for time instead.',
 cite:'IV-Bolus-Practice-1---Solutions.pdf, part h',
 quote:'First order processes, it is gonna take 10 half-lives for 99.9% of the drug to be eliminated from the body.'},

/* ---------- L02 numeric: second wording, two plasma points ---------- */
{id:'m2-n-k2', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'k-from-two-points', skill:'krate',
 source:'slide', dupOf:'m2-n-k1',
 stem:'250 mg of an antibiotic was administered as an IV bolus injection to a 70-kg patient. The concentration at 4 and 8 hours after administration of the dose was 6.6 mcg/mL and 2.18 mcg/mL, respectively. What is the elimination rate constant?',
 units:'hr⁻¹',
 answer:0.2769,
 tol:0.008,
 steps:[
  {k:'setup', t:'k = ln(Cp1/Cp2) / (t2 − t1)',
   why:'Two concentrations at two times define the slope of the log-linear decline, and the rate constant is that slope with the sign reversed. The earlier and larger concentration goes on top so the logarithm is positive, which is what keeps k from coming out negative.'},
  {k:'unit', t:'6.6 mcg/mL = 6.6 mg/L and 2.18 mcg/mL = 2.18 mg/L',
   why:'Dr. Mosley tells the class to take it on her word that micrograms per millilitre equals milligrams per litre, so no arithmetic conversion is needed. Here the units cancel inside the ratio anyway, but the equivalence matters for the later parts that pair a concentration with a dose in milligrams.'},
  {k:'algebra', t:'k = ln(6.6/2.18) / (8 − 4) hr = 1.10774 / 4 hr',
   why:'The ratio 6.6/2.18 is 3.0275 and its natural logarithm is 1.10774. Dividing by the four-hour interval between the samples converts a dimensionless logarithm into a quantity in reciprocal hours.'},
  {k:'round', t:'k = 0.2769 hr⁻¹',
   why:'The quotient is 0.276936, which her key prints as 0.2769 hr⁻¹. She asks for three to four decimal places on k so that early truncation does not shift every downstream answer.'}],
 teach:'The same two-point slope calculation works whether the data arrive as a table of six samples or as two concentrations stated in a sentence. What changes is only which two numbers are available. The interval in the denominator is the difference between the two sampling times, not the time since the dose, which is the step most often lost when the points are given in prose.',
 cite:'IV-Bolus-Practice-2---Solutions.pdf, part a',
 quote:'k = −ln(6.6/2.18) / (4 − 8) hr = 0.2769 hr⁻¹'},

/* ---------- L02 numeric: pounds, mg/kg, VD as % of body weight ---------- */
{id:'m2-n-cl2', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'cl-from-k-vd', skill:'clearance',
 source:'slide', dupOf:'m2-n-cl1',
 stem:'A 187-pound male patient received a drug by rapid IV injection. The drug has a half-life of 4 hours and an apparent volume of distribution that is 20% of body weight. What is the total body clearance in this patient?',
 units:'L/hr',
 answer:2.95,
 tol:0.08,
 steps:[
  {k:'unit', t:'187 lb ÷ 2.2 lb/kg = 85.0 kg',
   why:'Body weight in pharmacokinetics is always in kilograms, so a weight stated in pounds is converted before anything else is done with it. She divides by 2.2 and does not show the step, but every absolute quantity in this problem depends on it.'},
  {k:'setup', t:'ClT = k · VD, so the half-life has to become a rate constant and the percentage of body weight has to become an absolute volume before the two can be multiplied',
   why:'Total body clearance is the product of the elimination rate constant and the apparent volume of distribution, and neither is handed over directly here: the stem gives a half-life and a percentage. Naming the relation first is what shows which two quantities have to be assembled. Dr. Mosley withholds this relation from the exam equation sheet, so it has to be known rather than looked up.'},
  {k:'algebra', t:'VD = 0.2 L/kg × 85.0 kg = 17.0 L',
   why:'A volume of distribution that is 20% of body weight becomes 0.2 L per kilogram under the assumption that 1 L corresponds to 1 kg. Multiplying by the patient weight in kilograms converts it into the absolute volume that clearance needs.'},
  {k:'algebra', t:'k = 0.693 / 4 hr = 0.1733 hr⁻¹',
   why:'The clearance equation takes a rate constant, not a half-life, so the stated half-life is converted first. Her keys report k to four decimal places throughout.'},
  {k:'algebra', t:'ClT = k·VD = (0.1733 hr⁻¹)(17.0 L) = 2.9461 L/hr',
   why:'Reciprocal hours multiplied by litres gives litres per hour. This is the relationship she withholds from the equation sheet, so both factors have to be assembled before it can be used.'},
  {k:'round', t:'ClT = 2.95 L/hr',
   why:'Her key prints 2.95 L/hr, two decimal places. Carrying k unrounded as 0.17325 hr⁻¹ gives 2.9453 L/hr, which rounds to the same value.'}],
 teach:'A clearance question with the weight in pounds is really three steps stacked. Convert the weight to kilograms, turn the per-kilogram or percent-of-body-weight volume into an absolute volume in litres, and convert the half-life into a rate constant. Only then does the one-line product k·VD apply. Each of the three steps has its own unit check, and skipping any of them changes the answer by a whole factor rather than a rounding.',
 cite:'IV-Bolus-Practice-3---Solutions.pdf, problem 1 part c',
 quote:'Cl_T = (17 L)(0.1733 hr⁻¹) = 2.95 L/hr'},

{id:'m2-n-deck12', type:'numeric', prof:'Mosley', tier:'new', exam:1, module:2, lecture:'L02',
 topic:'bolus1', sub:'calc', concept:'amount-at-t', skill:'conctime',
 source:'both', dupOf:'m2-n-d3a',
 stem:'A new drug was administered as a single IV dose of 200 mg to an 80-kg adult male. After 6 hours the plasma drug concentration was 15 mg/L of plasma. Assuming that the apparent VD is 10% of body weight, estimate the amount of drug in the body after 12 hours.',
 units:'mg',
 answer:72.0,
 tol:1.5,
 steps:[
  {k:'setup', t:'The amount left at 12 hr is DB = D0·e^(−kt), so the rate constant has to be recovered first from the measured 6-hour concentration by way of the volume of distribution',
   why:'The question asks for an amount at a time no measurement was taken at, so the route runs through the rate constant rather than through the data directly. The one measured concentration becomes an amount only once the volume of distribution is known, and that volume is given as a percentage of body weight rather than as a number of litres. Naming the whole chain first is what keeps the three conversions in order.'},
  {k:'algebra', t:'VD = 10% of 80 kg = 8 L, using 1 L per 1 kg of body weight',
   why:'The volume of distribution is stated as a percent of body weight, so the one-to-one litre-per-kilogram assumption converts it to an absolute volume. Dr. Mosley confirms 8 L with the class before going any further.'},
  {k:'algebra', t:'DB at 6 hr = VD · Cp = (8 L)(15 mg/L) = 120 mg',
   why:'The measured quantity is a concentration but the rate constant has to be found from two amounts or two concentrations of the same kind. Converting the 6-hour concentration into an amount lets it be compared directly with the 200 mg dose, which is the apples-to-apples step she insists on.'},
  {k:'algebra', t:'k = ln(D0/D6) / t = ln(200 mg / 120 mg) / 6 hr = 0.08514 hr⁻¹',
   why:'The dose is the amount at time zero and 120 mg is the amount at 6 hours, so their ratio over the 6-hour interval gives the rate constant. Because both are amounts in milligrams, the units cancel inside the logarithm.'},
  {k:'algebra', t:'DB at 12 hr = D0·e^(−kt) = (200 mg)·e^(−0.08514 hr⁻¹ × 12 hr) = 72.0 mg',
   why:'The exponent is −1.0217 and e raised to it is 0.3600, so 36% of the dose remains at 12 hours. Milligrams multiplied by a dimensionless fraction leaves milligrams.'},
  {k:'round', t:'DB = 72 mg',
   why:'She reports 72-ish milligrams in class and the handwritten working on the slide agrees. Twelve hours is a little under two half-lives of roughly 8.14 hr, so somewhat more than a quarter of 200 mg should remain, which 72 mg is.'}],
 teach:'This problem hides a unit mismatch in the middle. The dose is an amount and the measured value is a concentration, and a rate constant cannot be taken from the ratio of one to the other. The volume of distribution is what converts between them, so it is found first even though the question does not ask for it. Once both quantities are amounts, the ordinary two-point slope calculation applies.',
 cite:'2IVBolusAdministration.pdf, slide "Practice" (one-compartment section)',
 quote:'estimate the amount of drug in the body after 12 hours',
